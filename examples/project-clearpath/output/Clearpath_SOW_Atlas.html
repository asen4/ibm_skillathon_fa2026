e FHIR API is not ready", "likelihood": 3, "impact": 3, "origin": "inferred", "signal": "Interop Vendor has not booked the joint test sessions by Week 18", "contingency": "Launch on portal and EDI, add FHIR when ready. LVH manages the vendor.", "owner": "Elena Sorvino", "links": ["D6", "D13"], "lens": "client", "src": ["s5a", "s6_2d"]}, {"id": "R7", "title": "AI reads faxes with low confidence", "likelihood": 3, "impact": 3, "origin": "inferred", "signal": "More than 30% of fax cases routed to coordinators in testing", "contingency": "Tune per document type, adjust thresholds through the Design Authority, track handling time separately.", "owner": "Sofia Marquez", "links": ["D9", "D13"], "lens": "both", "src": ["s2_3b", "s2_2e"]}, {"id": "R8", "title": "Staff worry about their roles", "likelihood": 3, "impact": 4, "origin": "inferred", "signal": "Low attendance at super-user sessions, questions about headcount", "contingency": "Lead with the role descriptions in D4 and D7. LVH runs any employee consultation.", "owner": "Hannah Kim and Marcus Hale", "links": ["D7", "D12"], "lens": "client", "src": ["s6_3d", "s4_d7"]}, {"id": "R9", "title": "Criteria license blocks automation", "likelihood": 2, "impact": 5, "origin": "sow", "signal": "Criteria vendor has not confirmed automated use by Week 8", "contingency": "Confirm in writing during Discovery. Fees are LVH's.", "owner": "Dr. Priya Raman", "links": ["D5", "D10"], "lens": "both", "src": ["s9h", "s5e"]}, {"id": "R10", "title": "UAT testers pulled back to the queue", "likelihood": 3, "impact": 4, "origin": "inferred", "signal": "Fewer than 15 testers confirmed by Week 19", "contingency": "Book testers at Design Approval, run UAT in shifts, back-fill intake.", "owner": "Marcus Hale", "links": ["CD8", "D13"], "lens": "client", "src": ["s6_3b"]}, {"id": "R11", "title": "Benefits window overlaps hypercare", "likelihood": 3, "impact": 3, "origin": "inferred", "signal": "Wave 3 issues still open in Week 30", "contingency": "Report Wave 3 separately, or use the hypercare option to measure longer.", "owner": "Ben Ochoa", "links": ["D19", "D20"], "lens": "ibm", "src": ["s2_2window", "s11_3"]}], "obligations": [{"id": "O1", "party": "client", "text": "Sign the BAA, name client roles, issue network accounts", "week": 0, "kind": "provide", "src": ["s6_1"]}, {"id": "O2", "party": "ibm", "text": "Deliver the Project Charter and Integrated Plan (D1)", "week": 2, "kind": "deliver", "src": ["s4_d1"]}, {"id": "O3", "party": "client", "text": "Give read-only access to 24 months of event logs", "week": 3, "kind": "provide", "src": ["s6_2a"]}, {"id": "O4", "party": "client", "text": "Run the provider pulse survey (first round)", "week": 3, "kind": "provide", "src": ["s6_3e"]}, {"id": "O5", "party": "client", "text": "At least 6 nurses and 4 coordinators as SMEs, up to 4 hours a week each", "week": 3, "until": 13, "kind": "attend", "src": ["s6_3b"]}, {"id": "O6", "party": "ibm", "text": "Deliver the baseline report (D2)", "week": 6, "kind": "deliver", "src": ["s4_d2"]}, {"id": "O7", "party": "client", "text": "Clinical Policy Owner at 20% time, decisions within 5 business days", "week": 7, "until": 25, "kind": "decide", "src": ["s6_3a"]}, {"id": "O8", "party": "client", "text": "watsonx subscription active (an assumption in Section 9, so a PCR if it slips)", "week": 10, "kind": "provide", "src": ["s9e"]}, {"id": "O9", "party": "client", "text": "Approve every Auto-Approval Rule in writing", "week": 11, "kind": "decide", "src": ["s4_d5"]}, {"id": "O10", "party": "client", "text": "Finish the security review of D6 (contract deadline; the plan hopes for Week 13)", "week": 15, "kind": "review", "src": ["s6_2c"]}, {"id": "O11", "party": "client", "text": "Provide the UM Platform test environment with APIs on", "week": 14, "kind": "provide", "src": ["s6_2b"]}, {"id": "O12", "party": "client", "text": "Name the Client UM Lead for UAT", "week": 18, "kind": "provide", "src": ["s8_2uat"]}, {"id": "O13", "party": "ibm", "text": "Train up to 40 super users", "week": 21, "kind": "deliver", "src": ["s4_d12"]}, {"id": "O14", "party": "client", "text": "Provide 15 UM staff for UAT", "week": 21, "until": 22, "kind": "attend", "src": ["s6_3b"]}, {"id": "O15", "party": "client", "text": "Train remaining UM staff before the pilot go-live", "week": 23, "kind": "provide", "src": ["s6_3c"]}, {"id": "O16", "party": "ibm", "text": "Elevated support for two weeks after each go-live", "week": 24, "until": 30, "kind": "deliver", "src": ["s7_monday"]}, {"id": "O17", "party": "client", "text": "Train remaining UM staff before Wave 2 and Wave 3", "week": 26, "until": 28, "kind": "provide", "src": ["s6_3c"]}, {"id": "O18", "party": "client", "text": "Decide on the hypercare extension, in writing", "week": 30, "kind": "decide", "src": ["s11_3"]}, {"id": "O19", "party": "client", "text": "Run the provider pulse survey (second round)", "week": 30, "kind": "provide", "src": ["s6_3e"]}, {"id": "O20", "party": "ibm", "text": "Deliver the Benefits Realization Report (D20)", "week": 31, "kind": "deliver", "src": ["s4_d20"]}, {"id": "O21", "party": "ibm", "text": "Hand over runbooks and knowledge transfer (D21)", "week": 32, "kind": "deliver", "src": ["s4_d21"]}, {"id": "O22", "party": "client", "text": "Review each deliverable within 5 business days", "week": 1, "until": 32, "kind": "review", "src": ["s6_4"]}, {"id": "O23", "party": "ibm", "text": "Answer each PCR with an impact assessment in 5 business days", "week": 1, "until": 32, "kind": "deliver", "src": ["s10a"]}, {"id": "O24", "party": "client", "text": "Approve or reject each PCR within 5 business days of the assessment", "week": 1, "until": 32, "kind": "decide", "src": ["s10a"]}, {"id": "O25", "party": "client", "text": "Manage the UM Platform vendor and Interop Vendor", "week": 1, "until": 32, "kind": "provide", "src": ["s6_2d"]}, {"id": "O26", "party": "client", "text": "Pay each invoice within 45 days", "week": 2, "until": 32, "kind": "pay", "src": ["s11_4"]}, {"id": "O27", "party": "client", "text": "Run any consultation with employees about role changes", "week": 12, "until": 29, "kind": "provide", "src": ["s6_3d"]}], "faq": [{"q": "When do we go live?", "a": "Advanced imaging pilots in Week 24 (June 21, 2027). DME and home health follow in Week 27, and outpatient surgery in Week 29, which counts as Full Go-Live.", "lens": "both", "src": ["s4_d15", "s4_d17", "s4_d19"]}, {"q": "Will a machine ever deny a request?", "a": "No. Rules can approve or send a case to a person. Only a licensed clinician can make an adverse determination, and only the Steering Committee can change that.", "lens": "both", "src": ["s2_3a", "s2_3intro"]}, {"q": "Is IBM guaranteeing the 5 day target?", "a": "No. The Success Measures are shared goals. Missing one is not by itself a breach, because results depend on LVH decisions, provider behavior and staffing too.", "lens": "both", "src": ["s2_2shared"]}, {"q": "What does LVH have to do in the first month?", "a": "Sign the BAA and name the roles by Jan 4, give event log access within 10 business days, make nurse and coordinator SMEs available, and run the first provider survey in Week 3.", "lens": "client", "src": ["s6_1", "s6_2a", "s6_3b", "s6_3e"]}, {"q": "What happens if LVH is late on something?", "a": "IBM tells LVH, and the two sides use change control to agree any effect on schedule, fees or deliverables.", "lens": "both", "src": ["s6intro"]}, {"q": "What is not included in the $4.86M?", "a": "Software and subscriptions (including watsonx), criteria licenses, UM Platform vendor work, the FHIR API, end-user training beyond super users, and extra staff. Travel expenses are billed on top, capped at 7% of the fee unless LVH approves more in writing.", "lens": "client", "src": ["s5g", "s5e", "s5h", "s5a", "s5i", "s11_2"]}, {"q": "How do we change scope?", "a": "Either side raises a PCR. IBM sends an impact assessment in 5 business days and LVH decides within 5 more. Anything over $100,000 or that moves a go-live goes to the Steering Committee.", "lens": "both", "src": ["s10a", "s10b"]}, {"q": "When does IBM get paid?", "a": "On six milestones: Charter 10%, Discovery Sign-off 15%, Design Approval 20%, Go/No-Go 20%, Full Go-Live 20% and Final Acceptance 15%. Invoices are due in 45 days.", "lens": "ibm", "src": ["s11_1", "s11_4"]}, {"q": "What if a Steering Committee meeting cannot be scheduled?", "a": "If the forum does not meet within 5 business days of IBM's request, the gate completes when IBM meets the entry criteria written in the Charter.", "lens": "ibm", "src": ["s12gov"]}, {"q": "Can IBM move the key people?", "a": "Not the Engagement Manager or the AI Solution Lead during Phases 2 and 3, without LVH's consent, except for reasons outside IBM's control.", "lens": "client", "src": ["s8_1keep"]}, {"q": "Who signs off testing?", "a": "The Client UM Lead, who has to be named by Week 18. Testing passes when there are no open Severity 1 or 2 defects.", "lens": "both", "src": ["s4_d13", "s8_2uat"]}, {"q": "Which services are covered?", "a": "Three categories: advanced imaging, durable medical equipment and home health, and outpatient surgical procedures. Pharmacy and behavioral health are out.", "lens": "both", "src": ["s3_1", "s5b", "s5c"]}], "tour": [{"view": "brief", "title": "What this project is", "text": "One sentence, the deal, and the seven numbers that define success. Everything on this page links to the clause it came from."}, {"view": "brief", "focus": "findings", "title": "Three things to settle now", "text": "The atlas found three places where the SOW contradicts itself or leaves a gap. Settling them in Week 2 is cheap. Discovering them in Week 13 is not."}, {"view": "route", "title": "The route from Week 1 to Week 32", "text": "Each colored line is a workstream and each stop is a deliverable. The grey bars that cross every line are decision gates. Money sits underneath."}, {"view": "route", "focus": "D15", "title": "Trace any stop", "text": "Pick a stop to see everything it depends on and everything that waits for it. This is the pilot go-live and its full chain."}, {"view": "route", "focus": "slip:CD3:2", "title": "What if security takes its full window?", "text": "The SOW lets LVH take until Week 15 to review the architecture. Watch Design Approval, all three go-lives and four payments move, and Final Acceptance land after the term ends on Aug 31."}, {"view": "org", "focus": "um", "title": "Where the work lands", "text": "From a $6.8B health system down to one department of 260 people, and the three teams whose day changes most."}, {"view": "process", "title": "Today versus target", "text": "The seven steps of prior auth today, where time is lost, and what each new capability replaces."}, {"view": "owes", "title": "Who owes what, and when", "text": "Every obligation for both sides on one timeline. Drag the week marker and anything overdue lights up."}], "sources": {"s1_1a": {"sec": "1.1", "text": "LVH employs approximately 21,000 people and reported consolidated operating revenue of $6.8 billion in fiscal year 2026."}, "s1_1b": {"sec": "1.1", "text": "(a) Larkspur Hospitals & Clinics, which runs six acute care hospitals, 140 ambulatory sites and the Larkspur Medical Group"}, "s1_1c": {"sec": "1.1", "text": "(c) LVH Shared Services, which provides Information Technology, Information Security, Finance, Human Resources and Legal & Privacy services to both operating divisions."}, "s1_2a": {"sec": "1.2", "text": "The Plan serves approximately 640,000 members across three lines of business: Medicare Advantage (approximately 180,000 members), Medicaid managed care (approximately 290,000 members) and Commercial and individual marketplace products (approximately 170,000 members)."}, "s1_2strat": {"sec": "1.2", "text": "The Plan's strategic plan for 2026 through 2028, titled \"Simpler Care, Sooner,\" names reduction of administrative burden on providers and faster access to care for members as its first two enterprise priorities."}, "s1_3um": {"sec": "1.3", "text": "The Services will primarily affect the Utilization Management department (\"UM\"), which sits within the Plan's Clinical Operations function under the Plan Chief Medical Officer. UM employs approximately 260 staff, consisting of approximately 95 intake coordinators, 140 nurse reviewers, 12 physician medical directors and 13 UM analysts, organized into three teams: Intake & Triage, Clinical Review and Physician Review."}, "s1_3pns": {"sec": "1.3", "text": "The Services will also involve the Plan's Provider Network Services department, which manages provider relations and the provider portal; the Plan's Member Services department, which handles member inquiries about authorization status; the Plan's Compliance Office; and, within LVH Shared Services, the Enterprise Applications group of Information Technology, which operates the Client's utilization management platform (the \"UM Platform\"), as well as Information Security and Human Resources."}, "s1_3hosp": {"sec": "1.3", "text": "Larkspur Hospitals & Clinics is itself a high-volume submitter of prior authorization requests to the Plan and will participate as a pilot provider group."}, "s1_3out": {"sec": "1.3", "text": "The Plan's Appeals & Grievances department, the pharmacy benefit (administered by the Client's pharmacy benefit manager) and behavioral health utilization management (delegated to a third-party behavioral health organization) are not in scope, except as described in Section 5."}, "s1_4vol": {"sec": "1.4", "text": "The Plan received approximately 410,000 prior authorization requests in the twelve months ending September 30, 2026."}, "s1_4chan": {"sec": "1.4", "text": "Approximately 38% of requests were received by fax, 12% by telephone and 50% through the provider portal."}, "s1_4keying": {"sec": "1.4", "text": "Requests received by fax or telephone are manually keyed into the UM Platform by intake coordinators, which takes an average of 22 minutes per request."}, "s1_4notreq": {"sec": "1.4", "text": "Approximately 18% of all requests are submitted for services that do not require prior authorization under the member's benefit plan."}, "s1_4pend": {"sec": "1.4", "text": "Approximately 42% of requests are pended for missing clinical documentation, which adds an average of 3.2 calendar days to the decision."}, "s1_4review": {"sec": "1.4", "text": "Nurse reviewers apply licensed clinical criteria to determine medical necessity and escalate approximately 14% of requests to a physician medical director. Determinations are communicated by fax and letter, and providers place an average of 1.8 status calls per request to the Plan's provider services line."}, "s1_4time": {"sec": "1.4", "text": "For standard (non-urgent) requests, the median time from receipt to determination is 9.4 calendar days. For expedited requests, the Plan met the 72-hour decision timeframe for 81% of requests. Fewer than 4% of requests are approved without human review."}, "s1_5cms": {"sec": "1.5", "text": "The Plan is subject to the federal Interoperability and Prior Authorization requirements issued by the Centers for Medicare & Medicaid Services (CMS-0057-F), including decision timeframes of 72 hours for expedited requests and seven calendar days for standard requests for impacted lines of business, and annual public reporting of prior authorization metrics."}, "s1_5board": {"sec": "1.5", "text": "The Plan's Board of Directors has asked management to report measurable improvement by the third quarter of 2027."}, "s2_1": {"sec": "2.1", "text": "The objective of Project Clearpath (the \"Project\") is to redesign the Plan's prior authorization process from receipt of request to communication of determination, and to implement AI-assisted intake, automated approval of low-risk requests and AI-generated clinical summaries for reviewers, so that the Plan meets its regulatory decision timeframes and materially reduces administrative burden on providers and UM staff."}, "s2_2window": {"sec": "2.2", "text": "Targets apply to the service categories that are live at the time of measurement and will be measured over the four weeks before the Benefits Realization Report described in Section 4."}, "s2_2a": {"sec": "2.2(a)", "text": "Median decision time for standard requests reduced from 9.4 calendar days to 5.0 calendar days or less."}, "s2_2b": {"sec": "2.2(b)", "text": "Expedited requests decided within 72 hours increased from 81% to 99% or more."}, "s2_2c": {"sec": "2.2(c)", "text": "Share of requests received electronically (portal or electronic data interchange) increased from 50% to 75% or more."}, "s2_2d": {"sec": "2.2(d)", "text": "Share of requests approved by automated rules without nurse review increased from less than 4% to 25% or more."}, "s2_2e": {"sec": "2.2(e)", "text": "Average intake handling time for fax requests reduced from 22 minutes to 6 minutes or less."}, "s2_2f": {"sec": "2.2(f)", "text": "Share of requests pended for missing documentation reduced from 42% to 20% or less."}, "s2_2g": {"sec": "2.2(g)", "text": "Provider satisfaction with prior authorization increased from 2.9 to 3.8 out of 5 or more, measured by a pulse survey administered by the Client."}, "s2_2shared": {"sec": "2.2", "text": "The Success Measures are shared goals. IBM's obligation is to perform the Services and provide the Deliverables in accordance with this SOW. Failure to achieve a Success Measure is not, by itself, a breach of this SOW by IBM, because achievement depends on Client decisions, provider behavior, Client staffing and other factors outside IBM's control."}, "s2_3intro": {"sec": "2.3", "text": "The parties agree that the solution will follow these principles, which may only be changed by the Executive Steering Committee:"}, "s2_3a": {"sec": "2.3(a)", "text": "No automated denials. Automated rules may approve a request or route it to a human reviewer. Any adverse determination will be made by an appropriately licensed clinician employed or contracted by the Client."}, "s2_3b": {"sec": "2.3(b)", "text": "Where the AI intake service extracts data with a confidence score below a threshold set by the Design Authority, the case will be routed to an intake coordinator for verification."}, "s2_3c": {"sec": "2.3(c)", "text": "Every automated approval and every AI clinical summary will record the criteria, source documents and model version used, so that UM staff, auditors and regulators can trace how it was produced."}, "s3_1": {"sec": "3.1", "text": "IBM will then design the future-state process, including target roles, decision points and service levels, for up to three service categories: (i) advanced imaging, (ii) durable medical equipment and home health, and (iii) outpatient surgical procedures."}, "s3_2": {"sec": "3.2", "text": "(c) an automated check that tells providers at the time of submission whether a service requires prior authorization; and (d) an AI-generated clinical summary that presents relevant information from the submitted records to nurse reviewers alongside the applicable criteria. IBM will configure up to 120 Auto-Approval Rules in total."}, "s3_3": {"sec": "3.3", "text": "IBM will build a prior authorization operations dashboard showing the Success Measures and daily operational metrics."}, "s3_4": {"sec": "3.4", "text": "deliver train-the-trainer sessions for up to 40 Client super users, and design and support a provider adoption campaign to move submitting providers from fax and telephone to electronic submission."}, "s3_5": {"sec": "3.5", "text": "IBM will provide an Engagement Manager who will maintain the integrated project plan, risk and issue log and decision log, run the weekly status meeting, prepare materials for the Executive Steering Committee, and administer the change control procedure in Section 10."}, "s3_6a": {"sec": "3.6(a)", "text": "Phase 0, Mobilize (Weeks 1 to 2): onboarding, access requests, confirmation of the integrated plan."}, "s3_6b": {"sec": "3.6(b)", "text": "Phase 1, Discover (Weeks 3 to 8): process mining, workshops and baseline validation."}, "s3_6c": {"sec": "3.6(c)", "text": "Phase 2, Design (Weeks 7 to 13): future-state process, AI use case design, Auto-Approval Rule logic and solution architecture."}, "s3_6d": {"sec": "3.6(d)", "text": "Phase 3, Build and Pilot (Weeks 12 to 25): build, system integration testing, user acceptance testing and a pilot in the advanced imaging service category with the Larkspur Medical Group and up to 25 additional provider groups."}, "s3_6e": {"sec": "3.6(e)", "text": "Phase 4, Scale (Weeks 25 to 29): rollout of durable medical equipment and home health (Wave 2) and outpatient surgical procedures (Wave 3)."}, "s3_6f": {"sec": "3.6(f)", "text": "Phase 5, Hypercare and Handover (Weeks 29 to 32): stabilization support, benefits measurement and handover to Client operations."}, "s3_6start": {"sec": "3.6", "text": "\"Week 1\" begins on the Project Start Date, which is January 11, 2027, provided the conditions in Section 6.1 are met."}, "s4_d1": {"sec": "4, D1", "text": "D1. Project Charter and Integrated Plan (Week 2). Project objectives, governance, roles, integrated plan, risk log and communication plan. Acceptance criteria: approved by the Client Project Manager."}, "s4_d2": {"sec": "4, D2", "text": "Acceptance criteria: baseline values reconcile to Client operational reports within 5%. This Deliverable depends on Client providing the data described in Section 6.2(a)."}, "s4_d3": {"sec": "4, D3", "text": "D3. Discovery Sign-off (Week 8). A Steering Committee decision that confirms the baseline, the prioritized opportunities and the three service categories. This is a governance milestone."}, "s4_d4": {"sec": "4, D4", "text": "D4. Future-State Process Design (Week 11). Future-state process models for the three service categories, target operating model, role descriptions and service levels."}, "s4_d5": {"sec": "4, D5", "text": "Acceptance criteria: each Auto-Approval Rule is approved in writing by the Clinical Policy Owner."}, "s4_d6": {"sec": "4, D6", "text": "D6. Solution Architecture and Integration Design (Week 12). Architecture, security design, data flows, UM Platform interface design and the Interop Vendor interface specification. Acceptance criteria: approved by the Design Authority and by LVH Information Security."}, "s4_d7": {"sec": "4, D7", "text": "D7. Change Impact Assessment and Adoption Strategy (Week 12). Role-by-role impact assessment, adoption strategy, communication plan and provider adoption approach."}, "s4_d8": {"sec": "4, D8", "text": "D8. Design Approval (Week 13). A Design Authority decision that approves D4, D5 and D6 for build. This is a governance milestone."}, "s4_d9": {"sec": "4, D9", "text": "D9. Intelligent Intake Service (Week 19). The AI intake service, configured and deployed to the Client's test environment, with document classification and data extraction for the three service categories."}, "s4_d10": {"sec": "4, D10", "text": "D10. Auto-Approval Rules and Prior Authorization Check (Week 20). Configured Auto-Approval Rules for the advanced imaging service category and the prior authorization requirement check."}, "s4_d11": {"sec": "4, D11", "text": "D11. UM Platform Integration (Week 20). Built and unit-tested integrations between the solution and the UM Platform."}, "s4_d12": {"sec": "4, D12", "text": "D12. Training Curriculum and Reviewer Playbooks (Week 21). Training materials for intake coordinators, nurse reviewers and medical directors, and delivery of train-the-trainer sessions."}, "s4_d13": {"sec": "4, D13", "text": "D13. Test Completion Report (Week 22). Results of system integration testing and user acceptance testing. Acceptance criteria: no open Severity 1 or Severity 2 defects, and UAT signed off by the Client UM Lead."}, "s4_d14": {"sec": "4, D14", "text": "D14. Pilot Go/No-Go Decision (Week 23). A Steering Committee decision to start the pilot. This is a governance milestone."}, "s4_d15": {"sec": "4, D15", "text": "D15. Pilot Go-Live: Advanced Imaging (Week 24). The solution in production for the advanced imaging service category with the pilot provider groups."}, "s4_d16": {"sec": "4, D16", "text": "D16. Pilot Results Report and Scale Decision (Week 26). Pilot performance against the Success Measures, lessons learned and a Steering Committee decision on whether to proceed with Waves 2 and 3."}, "s4_d17": {"sec": "4, D17", "text": "D17. Wave 2 Go-Live: DME and Home Health (Week 27). Production rollout for durable medical equipment and home health, including the Auto-Approval Rules for that category."}, "s4_d18": {"sec": "4, D18", "text": "D18. Provider Adoption Campaign (Week 28). Execution support for the provider adoption campaign, including provider webinars, portal guides and a targeted outreach list of the top 200 fax-submitting providers."}, "s4_d19": {"sec": "4, D19", "text": "D19. Wave 3 Go-Live: Outpatient Surgical Procedures (Week 29). Production rollout for outpatient surgical procedures. Completion of D19 constitutes \"Full Go-Live.\""}, "s4_d20": {"sec": "4, D20", "text": "D20. Benefits Realization Report (Week 31). Measurement of the Success Measures over the preceding four weeks against baseline."}, "s4_d21": {"sec": "4, D21", "text": "D21. Operational Handover and Runbooks (Week 32). Operating runbooks, model monitoring procedures, rule maintenance procedures and knowledge transfer sessions for the Client's UM analytics and Enterprise Applications teams. Acceptance of D21 constitutes \"Final Acceptance.\""}, "s5a": {"sec": "5(a)", "text": "Design, build or operation of the Client's FHIR prior authorization application programming interface, which is provided by the Interop Vendor under a separate agreement with the Client. IBM's role is limited to providing the interface specification in D6 and participating in up to four joint integration testing sessions."}, "s5b": {"sec": "5(b)", "text": "Pharmacy prior authorization, which is administered by the Client's pharmacy benefit manager."}, "s5c": {"sec": "5(c)", "text": "Behavioral health utilization management, which is delegated to a third-party behavioral health organization."}, "s5d": {"sec": "5(d)", "text": "Redesign of the appeals and grievances process."}, "s5e": {"sec": "5(e)", "text": "Authoring, editing or licensing of clinical criteria content. The Client is responsible for maintaining its licenses to clinical criteria content and for any fees charged by the criteria vendor for automated use of that content."}, "s5f": {"sec": "5(f)", "text": "Decisions on provider contracting, gold-carding programs or changes to which services require prior authorization. IBM may model the impact of such decisions at the Client's request."}, "s5g": {"sec": "5(g)", "text": "Software licenses and cloud subscriptions, including IBM watsonx subscriptions, which the Client will purchase under a separate order. The fees in Section 11 do not include software or subscription charges."}, "s5h": {"sec": "5(h)", "text": "Configuration changes or custom development by the vendor of the UM Platform."}, "s5i": {"sec": "5(i)", "text": "End-user training of UM staff beyond the train-the-trainer sessions in D12, and supplemental staffing of intake or clinical review positions."}, "s5j": {"sec": "5(j)", "text": "Service categories other than the three listed in Section 3.1."}, "s6intro": {"sec": "6", "text": "If the Client does not perform a responsibility on time, IBM will notify the Client, and the parties will use the change control procedure in Section 10 to address any resulting effect on schedule, fees or Deliverables."}, "s6_1": {"sec": "6.1", "text": "Before the Project Start Date, the Client will: (a) execute a Business Associate Agreement with IBM covering the Services; (b) name the Client roles listed in Section 8.2; and (c) issue Client network accounts for the IBM team members named in the integrated plan. If these conditions are not met by January 4, 2027, the Project Start Date will move to the Monday after they are met."}, "s6_2a": {"sec": "6.2(a)", "text": "Within 10 business days after the Project Start Date, the Client will provide IBM with read-only access to UM Platform event logs and prior authorization case history for at least the 24 months before the Project Start Date, including service codes, diagnosis codes, request channel, status changes and timestamps."}, "s6_2b": {"sec": "6.2(b)", "text": "By Week 14, the Client will provide a test environment of the UM Platform with REST API access enabled and with test data that does not contain production protected health information, or that is approved for test use by the Client's Privacy Office."}, "s6_2c": {"sec": "6.2(c)", "text": "The Client will complete its security review of the solution architecture within 15 business days after IBM submits D6."}, "s6_2d": {"sec": "6.2(d)", "text": "The Client will manage its relationship with the UM Platform vendor and the Interop Vendor, and will ensure their participation in design and testing activities as needed."}, "s6_3a": {"sec": "6.3(a)", "text": "The Client will make the Clinical Policy Owner available for at least 20% of his or her working time during Phases 2 and 3, and will make decisions on clinical policy questions within 5 business days of a request."}, "s6_3b": {"sec": "6.3(b)", "text": "The Client will make at least six nurse reviewers and four intake coordinators available as subject matter experts for up to four hours per week each during Phases 1 and 2, and will provide at least 15 UM staff for user acceptance testing during Weeks 21 and 22."}, "s6_3c": {"sec": "6.3(c)", "text": "The Client will provide up to 40 super users for train-the-trainer sessions and will deliver end-user training to the remaining UM staff before each go-live."}, "s6_3d": {"sec": "6.3(d)", "text": "The Client is responsible for any consultation with employees or their representatives about changes to roles, staffing levels or work assignments arising from the Project."}, "s6_3e": {"sec": "6.3(e)", "text": "The Client will administer the provider pulse survey used for Success Measure (g) in Week 3 and Week 30."}, "s6_4": {"sec": "6.4", "text": "The Client will review each Deliverable and either accept it or provide a written description of any nonconformity with its acceptance criteria within 5 business days after IBM submits it."}, "s7_run": {"sec": "7", "text": "The Project will run for 32 weeks, from January 11, 2027 to August 20, 2027."}, "s7_deps": {"sec": "7", "text": "D9, D10 and D11 depend on D8, and D11 also depends on the test environment in Section 6.2(b)"}, "s7_monday": {"sec": "7", "text": "Each go-live will be scheduled for a Monday and will be followed by a two-week period during which IBM provides elevated support."}, "s8_1": {"sec": "8.1", "text": "IBM will provide the following key personnel: Kavita Menon, Partner and Engagement Executive; David Lund, Engagement Manager; Ben Ochoa, Process Studio and Process Mining Lead; Sofia Marquez, AI Solution Lead; Arjun Patel, Integration Architect; and Hannah Kim, Change and Adoption Lead."}, "s8_1team": {"sec": "8.1", "text": "IBM will staff the Project with a team of approximately 14 people at peak, including onshore and offshore resources."}, "s8_1keep": {"sec": "8.1", "text": "IBM will not reassign the Engagement Manager or the AI Solution Lead during Phases 2 and 3 without the Client's consent, which will not be unreasonably withheld, except for reasons outside IBM's reasonable control."}, "s8_2a": {"sec": "8.2", "text": "Executive Sponsor, Dr. Renata Okafor, Chief Medical Officer of the Plan; Client Project Manager, Marcus Hale, Director of UM Operations; Clinical Policy Owner, Dr. Priya Raman, Medical Director, Utilization Management; IT Lead, Elena Sorvino, Vice President, Enterprise Applications; Provider Adoption Lead, Tom Brandt, Director of Provider Network Services; Compliance Advisor, Janelle Price, Plan Compliance Officer"}, "s8_2uat": {"sec": "8.2", "text": "Client UM Lead for UAT, to be named by the Client Project Manager by Week 18."}, "s8_3a": {"sec": "8.3(a)", "text": "Executive Steering Committee. Meets monthly and at each governance milestone. Chaired by the Executive Sponsor; members include the Plan President, the IBM Partner, the Engagement Manager, the Client Project Manager and the IT Lead. Approves governance milestones, changes to Design Principles, and change requests above $100,000 or affecting a go-live date."}, "s8_3b": {"sec": "8.3(b)", "text": "Design Authority. Meets every two weeks during Phases 2 and 3. Co-chaired by the Clinical Policy Owner and IBM's AI Solution Lead; includes the IT Lead, Integration Architect, Compliance Advisor and Information Security. Approves architecture, rule logic, confidence thresholds and model changes."}, "s8_3c": {"sec": "8.3(c)", "text": "Weekly Status Meeting. Chaired by the Engagement Manager and the Client Project Manager. Reviews progress, risks, issues, decisions and upcoming Client responsibilities."}, "s8_3d": {"sec": "8.3(d)", "text": "Workstream Stand-ups. Held at least three times per week by each workstream lead."}, "s8_4a": {"sec": "8.4", "text": "Issues that cannot be resolved by workstream leads within 2 business days will be escalated to the Engagement Manager and the Client Project Manager."}, "s8_4b": {"sec": "8.4", "text": "Issues they cannot resolve within 3 business days will be escalated to the Executive Steering Committee, which will meet within 5 business days if a regular meeting is not scheduled. Issues the Executive Steering Committee cannot resolve will be handled under the dispute resolution provisions of the Agreement."}, "s9intro": {"sec": "9", "text": "If an assumption proves incorrect, either party may request a change under Section 10."}, "s9a": {"sec": "9(a)", "text": "Pilot volume will not exceed 4,500 prior authorization requests per week."}, "s9b": {"sec": "9(b)", "text": "The UM Platform's existing REST APIs support creating, updating and retrieving cases and attachments without custom development by the UM Platform vendor."}, "s9c": {"sec": "9(c)", "text": "At least 85% of historical prior authorization records contain structured service codes and diagnosis codes."}, "s9d": {"sec": "9(d)", "text": "The rollout will consist of the pilot and up to two additional waves."}, "s9e": {"sec": "9(e)", "text": "IBM watsonx will be deployed in a Client-approved IBM Cloud region, and the Client's subscription will be active by Week 10."}, "s9f": {"sec": "9(f)", "text": "Submitted documents and Deliverables will be in English."}, "s9g": {"sec": "9(g)", "text": "IBM will perform the Services primarily remotely, with up to 30% of team time on-site at the Riverbend Campus during workshops, testing and go-lives."}, "s9h": {"sec": "9(h)", "text": "The Client's licensed clinical criteria content may be used by automated rules under the Client's existing license."}, "s9i": {"sec": "9(i)", "text": "There will be no more than two rounds of review for each document Deliverable."}, "s10a": {"sec": "10", "text": "IBM will provide a written impact assessment, describing the effect on scope, schedule, fees and risk, within 5 business days."}, "s10b": {"sec": "10", "text": "PCRs above $100,000 or that change a go-live date require approval by the Executive Steering Committee."}, "s10c": {"sec": "10", "text": "Time spent preparing impact assessments of more than 8 hours for a single PCR will be billed at the rates in Section 11.3 if the Client approves the assessment work in advance."}, "s11_1": {"sec": "11.1", "text": "The Services in this SOW will be provided for a fixed fee of $4,860,000 (the \"Fixed Fee\"), payable on achievement of the following payment milestones:"}, "s11_1a": {"sec": "11.1(a)", "text": "Acceptance of D1, Project Charter and Integrated Plan: $486,000 (10%)."}, "s11_1b": {"sec": "11.1(b)", "text": "Completion of D3, Discovery Sign-off: $729,000 (15%)."}, "s11_1c": {"sec": "11.1(c)", "text": "Completion of D8, Design Approval: $972,000 (20%)."}, "s11_1d": {"sec": "11.1(d)", "text": "Completion of D14, Pilot Go/No-Go Decision: $972,000 (20%)."}, "s11_1e": {"sec": "11.1(e)", "text": "Completion of D19, Full Go-Live: $972,000 (20%)."}, "s11_1f": {"sec": "11.1(f)", "text": "Final Acceptance (acceptance of D21): $729,000 (15%)."}, "s11_2": {"sec": "11.2", "text": "Expenses will not exceed 7% of the Fixed Fee ($340,200) without the Client's prior written approval."}, "s11_3": {"sec": "11.3", "text": "At the Client's option, exercised in writing by Week 30, IBM will provide up to eight additional weeks of hypercare support on a time and materials basis at a blended rate of $210 per hour, not to exceed $420,000."}, "s11_4": {"sec": "11.4", "text": "IBM will invoice each payment milestone upon its achievement. Invoices are due within 45 days of the invoice date. Disputed amounts must be identified in writing within 15 days of the invoice date."}, "s12fix": {"sec": "12", "text": "IBM will correct any nonconformity and resubmit the Deliverable, and the review period will restart."}, "s12deemed": {"sec": "12", "text": "A Deliverable will be deemed accepted if the Client does not provide a written description of nonconformity within the review period, or if the Client uses the Deliverable in production."}, "s12gov": {"sec": "12", "text": "Governance milestones (D3, D8, D14 and D16) are completed when the relevant forum records its decision, or, if the forum does not meet within 5 business days of IBM's request, when IBM has satisfied the entry criteria documented in D1."}, "s13": {"sec": "13", "text": "This SOW begins on the SOW Date and ends on Final Acceptance or August 31, 2027, whichever comes first, unless extended by a PCR or by the Client's exercise of the option in Section 11.3."}}, "slip_rules": [{"when": "any", "text": "IBM notifies LVH, and the effect on schedule, fees or deliverables goes through change control.", "src": ["s6intro"]}, {"when": "golive_moves", "text": "Moving a go-live date is a PCR that needs Executive Steering Committee approval.", "src": ["s10b"]}, {"when": "term_breach", "text": "Final Acceptance would land after the SOW term ends. Extend the term with a PCR or the hypercare option.", "src": ["s13"]}], "slip_presets": [{"label": "Security review takes its full 15 days", "target": "CD3", "weeks": 2}, {"label": "Event logs arrive 3 weeks late", "target": "CD1", "weeks": 3}, {"label": "Test environment 2 weeks late", "target": "CD6", "weeks": 2}, {"label": "Start conditions slip 2 weeks", "target": "CD0", "weeks": 2}, {"label": "UAT runs long", "target": "D13", "weeks": 2}]};
const SECTIONS = [{"id": "0", "title": "Preamble", "text": "Statement of Work No. LVH-2026-014\n\nProject Clearpath: Prior Authorization Modernization\n\nFICTIONAL DOCUMENT. FOR DEMONSTRATION ONLY. Larkspur Valley Health, its people, figures and contract terms are invented for the IBM Process Studio Skillathon. No client data is used.\n\nStatement of Work No. LVH-2026-014 Project Clearpath: Prior Authorization Modernization\n\nThis Statement of Work (“SOW”) is entered into as of November 23, 2026 (the “SOW Date”) by and between Larkspur Valley Health, Inc. (“Client” or “LVH”) and International Business Machines Corporation (“IBM”), and is governed by the Master Services Agreement between the parties dated March 2, 2023 (the “Agreement”). Capitalized terms not defined in this SOW have the meanings given in the Agreement. If there is a conflict between this SOW and the Agreement, the Agreement controls unless this SOW expressly states otherwise."}, {"id": "1", "title": "Background and Client Environment", "text": ""}, {"id": "1.1", "title": "About the Client", "text": "Larkspur Valley Health, Inc. is a not-for-profit integrated delivery and financing system headquartered at the Riverbend Campus in Columbus, Ohio. LVH employs approximately 21,000 people and reported consolidated operating revenue of $6.8 billion in fiscal year 2026. LVH operates through three divisions: (a) Larkspur Hospitals & Clinics, which runs six acute care hospitals, 140 ambulatory sites and the Larkspur Medical Group; (b) Larkspur Health Plan, Inc. (“the Plan”), a wholly owned health plan subsidiary; and (c) LVH Shared Services, which provides Information Technology, Information Security, Finance, Human Resources and Legal & Privacy services to both operating divisions."}, {"id": "1.2", "title": "About the Plan", "text": "The Plan serves approximately 640,000 members across three lines of business: Medicare Advantage (approximately 180,000 members), Medicaid managed care (approximately 290,000 members) and Commercial and individual marketplace products (approximately 170,000 members). The Plan’s strategic plan for 2026 through 2028, titled “Simpler Care, Sooner,” names reduction of administrative burden on providers and faster access to care for members as its first two enterprise priorities. The Plan President reports to the LVH Chief Executive Officer."}, {"id": "1.3", "title": "Organizations in Scope", "text": "The Services will primarily affect the Utilization Management department (“UM”), which sits within the Plan’s Clinical Operations function under the Plan Chief Medical Officer. UM employs approximately 260 staff, consisting of approximately 95 intake coordinators, 140 nurse reviewers, 12 physician medical directors and 13 UM analysts, organized into three teams: Intake & Triage, Clinical Review and Physician Review. The Services will also involve the Plan’s Provider Network Services department, which manages provider relations and the provider portal; the Plan’s Member Services department, which handles member inquiries about authorization status; the Plan’s Compliance Office; and, within LVH Shared Services, the Enterprise Applications group of Information Technology, which operates the Client’s utilization management platform (the “UM Platform”), as well as Information Security and Human Resources. Larkspur Hospitals & Clinics is itself a high-volume submitter of prior authorization requests to the Plan and will participate as a pilot provider group.\n\nThe Plan’s Appeals & Grievances department, the pharmacy benefit (administered by the Client’s pharmacy benefit manager) and behavioral health utilization management (delegated to a third-party behavioral health organization) are not in scope, except as described in Section 5."}, {"id": "1.4", "title": "Current State of Prior Authorization", "text": "The Plan received approximately 410,000 prior authorization requests in the twelve months ending September 30, 2026. Approximately 38% of requests were received by fax, 12% by telephone and 50% through the provider portal. Requests received by fax or telephone are manually keyed into the UM Platform by intake coordinators, which takes an average of 22 minutes per request. Approximately 18% of all requests are submitted for services that do not require prior authorization under the member’s benefit plan. Approximately 42% of requests are pended for missing clinical documentation, which adds an average of 3.2 calendar days to the decision. Nurse reviewers apply licensed clinical criteria to determine medical necessity and escalate approximately 14% of requests to a physician medical director. Determinations are communicated by fax and letter, and providers place an average of 1.8 status calls per request to the Plan’s provider services line.\n\nFor standard (non-urgent) requests, the median time from receipt to determination is 9.4 calendar days. For expedited requests, the Plan met the 72-hour decision timeframe for 81% of requests. Fewer than 4% of requests are approved without human review. Provider satisfaction with the prior authorization experience, as measured by the Plan’s annual provider survey, was 2.9 out of 5."}, {"id": "1.5", "title": "Reason for the Project", "text": "The Plan is subject to the federal Interoperability and Prior Authorization requirements issued by the Centers for Medicare & Medicaid Services (CMS-0057-F), including decision timeframes of 72 hours for expedited requests and seven calendar days for standard requests for impacted lines of business, and annual public reporting of prior authorization metrics. The Plan’s performance does not consistently meet these requirements. The Plan’s Board of Directors has asked management to report measurable improvement by the third quarter of 2027."}, {"id": "2", "title": "Project Objectives and Success Measures", "text": ""}, {"id": "2.1", "title": "Objective", "text": "The objective of Project Clearpath (the “Project”) is to redesign the Plan’s prior authorization process from receipt of request to communication of determination, and to implement AI-assisted intake, automated approval of low-risk requests and AI-generated clinical summaries for reviewers, so that the Plan meets its regulatory decision timeframes and materially reduces administrative burden on providers and UM staff."}, {"id": "2.2", "title": "Success Measures", "text": "The parties will measure the Project against the following targets (the “Success Measures”). Baselines are as stated in Section 1.4. Targets apply to the service categories that are live at the time of measurement and will be measured over the four weeks before the Benefits Realization Report described in Section 4.\n\n(a) Median decision time for standard requests reduced from 9.4 calendar days to 5.0 calendar days or less.\n\n(b) Expedited requests decided within 72 hours increased from 81% to 99% or more.\n\n(c) Share of requests received electronically (portal or electronic data interchange) increased from 50% to 75% or more.\n\n(d) Share of requests approved by automated rules without nurse review increased from less than 4% to 25% or more.\n\n(e) Average intake handling time for fax requests reduced from 22 minutes to 6 minutes or less.\n\n(f) Share of requests pended for missing documentation reduced from 42% to 20% or less.\n\n(g) Provider satisfaction with prior authorization increased from 2.9 to 3.8 out of 5 or more, measured by a pulse survey administered by the Client.\n\nThe Success Measures are shared goals. IBM’s obligation is to perform the Services and provide the Deliverables in accordance with this SOW. Failure to achieve a Success Measure is not, by itself, a breach of this SOW by IBM, because achievement depends on Client decisions, provider behavior, Client staffing and other factors outside IBM’s control."}, {"id": "2.3", "title": "Design Principles", "text": "The parties agree that the solution will follow these principles, which may only be changed by the Executive Steering Committee:\n\n(a) No automated denials. Automated rules may approve a request or route it to a human reviewer. Any adverse determination will be made by an appropriately licensed clinician employed or contracted by the Client.\n\n(b) Human in the loop for low confidence. Where the AI intake service extracts data with a confidence score below a threshold set by the Design Authority, the case will be routed to an intake coordinator for verification.\n\n(c) Explainability. Every automated approval and every AI clinical summary will record the criteria, source documents and model version used, so that UM staff, auditors and regulators can trace how it was produced."}, {"id": "3", "title": "Scope of Services", "text": "IBM will provide the following services (the “Services”) through five workstreams over six phases. The phases overlap as shown in Section 7."}, {"id": "3.1", "title": "Workstream 1: Process Discovery and Design", "text": "IBM will use IBM Process Studio and process mining on UM Platform event logs to build a current-state model of the prior authorization process, quantify the baseline in Section 1.4, identify bottlenecks and rework loops, and conduct up to 12 discovery workshops with UM, Provider Network Services and Member Services staff. IBM will then design the future-state process, including target roles, decision points and service levels, for up to three service categories: (i) advanced imaging, (ii) durable medical equipment and home health, and (iii) outpatient surgical procedures."}, {"id": "3.2", "title": "Workstream 2: Intelligent Intake and Clinical Review", "text": "IBM will design, build and test: (a) an AI intake service using IBM watsonx that classifies incoming fax and portal documents, extracts member, provider, service and diagnosis information, and creates or updates cases in the UM Platform; (b) a set of automated approval rules (the “Auto-Approval Rules”) for low-risk requests within the three service categories, based on clinical policies approved by the Client; (c) an automated check that tells providers at the time of submission whether a service requires prior authorization; and (d) an AI-generated clinical summary that presents relevant information from the submitted records to nurse reviewers alongside the applicable criteria. IBM will configure up to 120 Auto-Approval Rules in total."}, {"id": "3.3", "title": "Workstream 3: Integration and Data", "text": "IBM will design and build integrations between the AI intake service, the Auto-Approval Rules and the UM Platform using the UM Platform’s published REST application programming interfaces, and will publish an interface specification that the Client’s interoperability vendor (the “Interop Vendor”) can use to connect the Client’s FHIR prior authorization interface to the solution. IBM will build a prior authorization operations dashboard showing the Success Measures and daily operational metrics."}, {"id": "3.4", "title": "Workstream 4: Change, Training and Provider Adoption", "text": "IBM will perform a change impact assessment for affected UM roles, develop an adoption strategy and communication plan, produce training curricula and reviewer playbooks, deliver train-the-trainer sessions for up to 40 Client super users, and design and support a provider adoption campaign to move submitting providers from fax and telephone to electronic submission."}, {"id": "3.5", "title": "Workstream 5: Project Management and Governance", "text": "IBM will provide an Engagement Manager who will maintain the integrated project plan, risk and issue log and decision log, run the weekly status meeting, prepare materials for the Executive Steering Committee, and administer the change control procedure in Section 10."}, {"id": "3.6", "title": "Phases", "text": "(a) Phase 0, Mobilize (Weeks 1 to 2): onboarding, access requests, confirmation of the integrated plan.\n\n(b) Phase 1, Discover (Weeks 3 to 8): process mining, workshops and baseline validation.\n\n(c) Phase 2, Design (Weeks 7 to 13): future-state process, AI use case design, Auto-Approval Rule logic and solution architecture.\n\n(d) Phase 3, Build and Pilot (Weeks 12 to 25): build, system integration testing, user acceptance testing and a pilot in the advanced imaging service category with the Larkspur Medical Group and up to 25 additional provider groups.\n\n(e) Phase 4, Scale (Weeks 25 to 29): rollout of durable medical equipment and home health (Wave 2) and outpatient surgical procedures (Wave 3).\n\n(f) Phase 5, Hypercare and Handover (Weeks 29 to 32): stabilization support, benefits measurement and handover to Client operations.\n\n“Week 1” begins on the Project Start Date, which is January 11, 2027, provided the conditions in Section 6.1 are met."}, {"id": "4", "title": "Deliverables", "text": "IBM will provide the following deliverables (each a “Deliverable”). Target weeks are subject to Client performance of its responsibilities in Section 6.\n\nD1. Project Charter and Integrated Plan (Week 2). Project objectives, governance, roles, integrated plan, risk log and communication plan. Acceptance criteria: approved by the Client Project Manager.\n\nD2. Current-State Process Model and Baseline Report (Week 6). Process Studio model of the current prior authorization process based on at least 12 months of UM Platform event logs, with baseline values for each Success Measure, variant analysis and a ranked list of improvement opportunities. Acceptance criteria: baseline values reconcile to Client operational reports within 5%. This Deliverable depends on Client providing the data described in Section 6.2(a).\n\nD3. Discovery Sign-off (Week 8). A Steering Committee decision that confirms the baseline, the prioritized opportunities and the three service categories. This is a governance milestone.\n\nD4. Future-State Process Design (Week 11). Future-state process models for the three service categories, target operating model, role descriptions and service levels.\n\nD5. AI Use Case and Auto-Approval Rule Design (Week 11). Detailed design of the AI intake service, the clinical summary and the logic for each proposed Auto-Approval Rule, including confidence thresholds. Acceptance criteria: each Auto-Approval Rule is approved in writing by the Clinical Policy Owner.\n\nD6. Solution Architecture and Integration Design (Week 12). Architecture, security design, data flows, UM Platform interface design and the Interop Vendor interface specification. Acceptance criteria: approved by the Design Authority and by LVH Information Security.\n\nD7. Change Impact Assessment and Adoption Strategy (Week 12). Role-by-role impact assessment, adoption strategy, communication plan and provider adoption approach.\n\nD8. Design Approval (Week 13). A Design Authority decision that approves D4, D5 and D6 for build. This is a governance milestone.\n\nD9. Intelligent Intake Service (Week 19). The AI intake service, configured and deployed to the Client’s test environment, with document classification and data extraction for the three service categories.\n\nD10. Auto-Approval Rules and Prior Authorization Check (Week 20). Configured Auto-Approval Rules for the advanced imaging service category and the prior authorization requirement check.\n\nD11. UM Platform Integration (Week 20). Built and unit-tested integrations between the solution and the UM Platform.\n\nD12. Training Curriculum and Reviewer Playbooks (Week 21). Training materials for intake coordinators, nurse reviewers and medical directors, and delivery of train-the-trainer sessions.\n\nD13. Test Completion Report (Week 22). Results of system integration testing and user acceptance testing. Acceptance criteria: no open Severity 1 or Severity 2 defects, and UAT signed off by the Client UM Lead.\n\nD14. Pilot Go/No-Go Decision (Week 23). A Steering Committee decision to start the pilot. This is a governance milestone.\n\nD15. Pilot Go-Live: Advanced Imaging (Week 24). The solution in production for the advanced imaging service category with the pilot provider groups.\n\nD16. Pilot Results Report and Scale Decision (Week 26). Pilot performance against the Success Measures, lessons learned and a Steering Committee decision on whether to proceed with Waves 2 and 3.\n\nD17. Wave 2 Go-Live: DME and Home Health (Week 27). Production rollout for durable medical equipment and home health, including the Auto-Approval Rules for that category.\n\nD18. Provider Adoption Campaign (Week 28). Execution support for the provider adoption campaign, including provider webinars, portal guides and a targeted outreach list of the top 200 fax-submitting providers.\n\nD19. Wave 3 Go-Live: Outpatient Surgical Procedures (Week 29). Production rollout for outpatient surgical procedures. Completion of D19 constitutes “Full Go-Live.”\n\nD20. Benefits Realization Report (Week 31). Measurement of the Success Measures over the preceding four weeks against baseline.\n\nD21. Operational Handover and Runbooks (Week 32). Operating runbooks, model monitoring procedures, rule maintenance procedures and knowledge transfer sessions for the Client’s UM analytics and Enterprise Applications teams. Acceptance of D21 constitutes “Final Acceptance.”"}, {"id": "5", "title": "Out of Scope", "text": "The following are not included in the Services. Any of them may be added through the change control procedure in Section 10.\n\n(a) Design, build or operation of the Client’s FHIR prior authorization application programming interface, which is provided by the Interop Vendor under a separate agreement with the Client. IBM’s role is limited to providing the interface specification in D6 and participating in up to four joint integration testing sessions.\n\n(b) Pharmacy prior authorization, which is administered by the Client’s pharmacy benefit manager.\n\n(c) Behavioral health utilization management, which is delegated to a third-party behavioral health organization.\n\n(d) Redesign of the appeals and grievances process.\n\n(e) Authoring, editing or licensing of clinical criteria content. The Client is responsible for maintaining its licenses to clinical criteria content and for any fees charged by the criteria vendor for automated use of that content.\n\n(f) Decisions on provider contracting, gold-carding programs or changes to which services require prior authorization. IBM may model the impact of such decisions at the Client’s request.\n\n(g) Software licenses and cloud subscriptions, including IBM watsonx subscriptions, which the Client will purchase under a separate order. The fees in Section 11 do not include software or subscription charges.\n\n(h) Configuration changes or custom development by the vendor of the UM Platform.\n\n(i) End-user training of UM staff beyond the train-the-trainer sessions in D12, and supplemental staffing of intake or clinical review positions.\n\n(j) Service categories other than the three listed in Section 3.1."}, {"id": "6", "title": "Client Responsibilities", "text": "The Client’s timely performance of the following responsibilities is essential to IBM’s performance. If the Client does not perform a responsibility on time, IBM will notify the Client, and the parties will use the change control procedure in Section 10 to address any resulting effect on schedule, fees or Deliverables."}, {"id": "6.1", "title": "Conditions for the Project Start Date", "text": "Before the Project Start Date, the Client will: (a) execute a Business Associate Agreement with IBM covering the Services; (b) name the Client roles listed in Section 8.2; and (c) issue Client network accounts for the IBM team members named in the integrated plan. If these conditions are not met by January 4, 2027, the Project Start Date will move to the Monday after they are met."}, {"id": "6.2", "title": "Data, Systems and Environments", "text": "(a) Within 10 business days after the Project Start Date, the Client will provide IBM with read-only access to UM Platform event logs and prior authorization case history for at least the 24 months before the Project Start Date, including service codes, diagnosis codes, request channel, status changes and timestamps.\n\n(b) By Week 14, the Client will provide a test environment of the UM Platform with REST API access enabled and with test data that does not contain production protected health information, or that is approved for test use by the Client’s Privacy Office.\n\n(c) The Client will complete its security review of the solution architecture within 15 business days after IBM submits D6.\n\n(d) The Client will manage its relationship with the UM Platform vendor and the Interop Vendor, and will ensure their participation in design and testing activities as needed."}, {"id": "6.3", "title": "People and Decisions", "text": "(a) The Client will make the Clinical Policy Owner available for at least 20% of his or her working time during Phases 2 and 3, and will make decisions on clinical policy questions within 5 business days of a request.\n\n(b) The Client will make at least six nurse reviewers and four intake coordinators available as subject matter experts for up to four hours per week each during Phases 1 and 2, and will provide at least 15 UM staff for user acceptance testing during Weeks 21 and 22.\n\n(c) The Client will provide up to 40 super users for train-the-trainer sessions and will deliver end-user training to the remaining UM staff before each go-live.\n\n(d) The Client is responsible for any consultation with employees or their representatives about changes to roles, staffing levels or work assignments arising from the Project.\n\n(e) The Client will administer the provider pulse survey used for Success Measure (g) in Week 3 and Week 30."}, {"id": "6.4", "title": "Review of Deliverables", "text": "The Client will review each Deliverable and either accept it or provide a written description of any nonconformity with its acceptance criteria within 5 business days after IBM submits it."}, {"id": "7", "title": "Schedule and Milestones", "text": "The Project will run for 32 weeks, from January 11, 2027 to August 20, 2027. The key milestones are Discovery Sign-off (Week 8), Design Approval (Week 13), Pilot Go/No-Go (Week 23), Pilot Go-Live (Week 24), Scale Decision (Week 26), Full Go-Live (Week 29) and Final Acceptance (Week 32). Dependencies between Deliverables are as follows: D2 depends on the data in Section 6.2(a); D4 and D5 depend on D2 and D3; D6 depends on D2; D7 depends on D4; D8 depends on D4, D5 and D6; D9, D10 and D11 depend on D8, and D11 also depends on the test environment in Section 6.2(b); D12 depends on D7 and D10; D13 depends on D9, D10 and D11; D14 depends on D12 and D13; D15 depends on D14; D16 depends on D15; D17 and D19 depend on D16; D18 depends on D15; D20 depends on D19; and D21 depends on D20.\n\nEach go-live will be scheduled for a Monday and will be followed by a two-week period during which IBM provides elevated support."}, {"id": "8", "title": "Project Organization and Governance", "text": ""}, {"id": "8.1", "title": "IBM Roles", "text": "IBM will provide the following key personnel: Kavita Menon, Partner and Engagement Executive; David Lund, Engagement Manager; Ben Ochoa, Process Studio and Process Mining Lead; Sofia Marquez, AI Solution Lead; Arjun Patel, Integration Architect; and Hannah Kim, Change and Adoption Lead. IBM will staff the Project with a team of approximately 14 people at peak, including onshore and offshore resources. IBM will not reassign the Engagement Manager or the AI Solution Lead during Phases 2 and 3 without the Client’s consent, which will not be unreasonably withheld, except for reasons outside IBM’s reasonable control."}, {"id": "8.2", "title": "Client Roles", "text": "The Client will provide the following roles: Executive Sponsor, Dr. Renata Okafor, Chief Medical Officer of the Plan; Client Project Manager, Marcus Hale, Director of UM Operations; Clinical Policy Owner, Dr. Priya Raman, Medical Director, Utilization Management; IT Lead, Elena Sorvino, Vice President, Enterprise Applications; Provider Adoption Lead, Tom Brandt, Director of Provider Network Services; Compliance Advisor, Janelle Price, Plan Compliance Officer; and Client UM Lead for UAT, to be named by the Client Project Manager by Week 18."}, {"id": "8.3", "title": "Governance Forums", "text": "(a) Executive Steering Committee. Meets monthly and at each governance milestone. Chaired by the Executive Sponsor; members include the Plan President, the IBM Partner, the Engagement Manager, the Client Project Manager and the IT Lead. Approves governance milestones, changes to Design Principles, and change requests above $100,000 or affecting a go-live date.\n\n(b) Design Authority. Meets every two weeks during Phases 2 and 3. Co-chaired by the Clinical Policy Owner and IBM’s AI Solution Lead; includes the IT Lead, Integration Architect, Compliance Advisor and Information Security. Approves architecture, rule logic, confidence thresholds and model changes.\n\n(c) Weekly Status Meeting. Chaired by the Engagement Manager and the Client Project Manager. Reviews progress, risks, issues, decisions and upcoming Client responsibilities.\n\n(d) Workstream Stand-ups. Held at least three times per week by each workstream lead."}, {"id": "8.4", "title": "Escalation", "text": "Issues that cannot be resolved by workstream leads within 2 business days will be escalated to the Engagement Manager and the Client Project Manager. Issues they cannot resolve within 3 business days will be escalated to the Executive Steering Committee, which will meet within 5 business days if a regular meeting is not scheduled. Issues the Executive Steering Committee cannot resolve will be handled under the dispute resolution provisions of the Agreement."}, {"id": "9", "title": "Assumptions", "text": "IBM’s estimate of fees and schedule is based on the following assumptions. If an assumption proves incorrect, either party may request a change under Section 10.\n\n(a) Pilot volume will not exceed 4,500 prior authorization requests per week.\n\n(b) The UM Platform’s existing REST APIs support creating, updating and retrieving cases and attachments without custom development by the UM Platform vendor.\n\n(c) At least 85% of historical prior authorization records contain structured service codes and diagnosis codes.\n\n(d) The rollout will consist of the pilot and up to two additional waves.\n\n(e) IBM watsonx will be deployed in a Client-approved IBM Cloud region, and the Client’s subscription will be active by Week 10.\n\n(f) Submitted documents and Deliverables will be in English.\n\n(g) IBM will perform the Services primarily remotely, with up to 30% of team time on-site at the Riverbend Campus during workshops, testing and go-lives.\n\n(h) The Client’s licensed clinical criteria content may be used by automated rules under the Client’s existing license.\n\n(i) There will be no more than two rounds of review for each document Deliverable."}, {"id": "10", "title": "Change Control", "text": "Either party may request a change to this SOW by submitting a Project Change Request (“PCR”) to the Engagement Manager and the Client Project Manager. IBM will provide a written impact assessment, describing the effect on scope, schedule, fees and risk, within 5 business days. Time spent preparing impact assessments of more than 8 hours for a single PCR will be billed at the rates in Section 11.3 if the Client approves the assessment work in advance. The Client will approve or reject the PCR within 5 business days after receiving the assessment. Until a PCR is signed by both parties, IBM will continue to perform under the existing terms of this SOW. PCRs above $100,000 or that change a go-live date require approval by the Executive Steering Committee."}, {"id": "11", "title": "Fees and Payment", "text": ""}, {"id": "11.1", "title": "Fixed Fee", "text": "The Services in this SOW will be provided for a fixed fee of $4,860,000 (the “Fixed Fee”), payable on achievement of the following payment milestones:\n\n(a) Acceptance of D1, Project Charter and Integrated Plan: $486,000 (10%).\n\n(b) Completion of D3, Discovery Sign-off: $729,000 (15%).\n\n(c) Completion of D8, Design Approval: $972,000 (20%).\n\n(d) Completion of D14, Pilot Go/No-Go Decision: $972,000 (20%).\n\n(e) Completion of D19, Full Go-Live: $972,000 (20%).\n\n(f) Final Acceptance (acceptance of D21): $729,000 (15%)."}, {"id": "11.2", "title": "Expenses", "text": "The Client will reimburse IBM for reasonable travel and living expenses incurred in accordance with the Client’s travel policy, billed monthly at actual cost. Expenses will not exceed 7% of the Fixed Fee ($340,200) without the Client’s prior written approval."}, {"id": "11.3", "title": "Optional Hypercare Extension", "text": "At the Client’s option, exercised in writing by Week 30, IBM will provide up to eight additional weeks of hypercare support on a time and materials basis at a blended rate of $210 per hour, not to exceed $420,000."}, {"id": "11.4", "title": "Invoicing", "text": "IBM will invoice each payment milestone upon its achievement. Invoices are due within 45 days of the invoice date. Disputed amounts must be identified in writing within 15 days of the invoice date."}, {"id": "12", "title": "Acceptance", "text": "IBM will submit each Deliverable to the Client Project Manager with a notice of completion. Within the review period in Section 6.4, the Client will either accept the Deliverable or describe in writing how it does not meet its acceptance criteria. IBM will correct any nonconformity and resubmit the Deliverable, and the review period will restart. A Deliverable will be deemed accepted if the Client does not provide a written description of nonconformity within the review period, or if the Client uses the Deliverable in production. Governance milestones (D3, D8, D14 and D16) are completed when the relevant forum records its decision, or, if the forum does not meet within 5 business days of IBM’s request, when IBM has satisfied the entry criteria documented in D1."}, {"id": "13", "title": "Term", "text": "This SOW begins on the SOW Date and ends on Final Acceptance or August 31, 2027, whichever comes first, unless extended by a PCR or by the Client’s exercise of the option in Section 11.3."}, {"id": "14", "title": "Signatures", "text": "Larkspur Valley Health, Inc. Name: ______________________ Title: ______________________ Date: __________\n\nInternational Business Machines Corporation Name: ______________________ Title: ______________________ Date: __________"}];
