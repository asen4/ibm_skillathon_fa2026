:root{
  color-scheme: light;
  --paper:#EDF0EF; --sheet:#FFFFFF; --ink:#17222D; --ink2:#4A5865; --ink3:#7A8793; --rule:#CFD7DB; --rule2:#E3E8EA;
  --signal:#F1C21B; --signal-soft:#FDF3C4; --signal-ink:#5C4700;
  --alert:#DA1E28; --alert-bg:#FFF0F0; --ok:#198038; --ok-bg:#EAF6EC;
  --ibm:#0043CE; --client:#A15C07;
  --sans:"Heros","Helvetica Neue",Helvetica,Arial,sans-serif;
  --cn:"Heros Cn","Helvetica Neue Condensed","Arial Narrow",var(--sans);
  --rail:212px; --top:64px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ibm);outline-offset:2px;border-radius:3px}
a{color:var(--ibm)}
.cn{font-family:var(--cn)}
.muted{color:var(--ink2)}
.small{font-size:13px}
.tiny{font-size:12px;color:var(--ink3)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- frame ---------- */
#app{display:grid;grid-template-columns:var(--rail) 1fr;grid-template-rows:auto var(--top) 1fr;min-height:100vh}
.fict{grid-column:1/-1;background:var(--ink);color:#fff;font-size:12px;padding:4px 20px;letter-spacing:.01em}
.fict b{color:var(--signal)}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 20px;background:var(--sheet);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto}
.brand .mark{flex:none}
.brand b{font-family:var(--cn);font-size:19px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.weekctl{display:flex;align-items:center;gap:10px;margin-left:auto;padding:6px 12px;border:1px solid var(--rule);border-radius:999px;background:var(--paper)}
.weekctl label{font-size:12px;color:var(--ink2);white-space:nowrap}
.weekctl input[type=range]{width:180px;accent-color:var(--ink)}
.weekctl output{font-family:var(--cn);font-size:15px;white-space:nowrap;min-width:150px}
.weekctl .dot{width:12px;height:12px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 3px var(--signal-soft);flex:none}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px;background:var(--paper)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 14px;font-size:13px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#25374a}
kbd{font-family:var(--sans);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink2);background:var(--sheet)}
.btn.dark kbd{background:transparent;color:#cfd7db;border-color:#4a5865}

nav.rail{grid-row:3;background:var(--sheet);border-right:1px solid var(--rule);padding:14px 10px;position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto}
nav.rail button{display:grid;grid-template-columns:22px 22px 1fr;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--ink2)}
nav.rail button .k{font-size:11px;color:var(--ink3);text-align:center;border:1px solid var(--rule2);border-radius:4px;line-height:18px}
nav.rail button svg{width:20px;height:20px}
nav.rail button:hover{background:var(--paper);color:var(--ink)}
nav.rail button[aria-current=page]{background:var(--ink);color:#fff}
nav.rail button[aria-current=page] .k{border-color:#4a5865;color:#cfd7db}
.rail .foot{margin-top:18px;padding:12px 10px;border-top:1px solid var(--rule2);font-size:12px;color:var(--ink3);line-height:1.45}
.rail .foot .lg{display:flex;align-items:center;gap:8px;margin:6px 0}
.lg-inf{width:22px;height:12px;border:1.5px dashed var(--ink3);border-radius:3px;flex:none}
.lg-src{display:inline-block;flex:none}

main{grid-row:3;min-width:0;padding:26px 30px 80px}
.view-h{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0 0 18px}
.view-h h1{font-family:var(--cn);font-size:34px;line-height:1.05;margin:0;letter-spacing:-.015em;font-weight:700}
.view-h p{margin:6px 0 0;color:var(--ink2);max-width:68ch}
h2{font-family:var(--cn);font-size:22px;line-height:1.15;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 4px}
.sec{margin:34px 0 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.sec-h p{margin:2px 0 0;color:var(--ink2);font-size:14px;max-width:72ch}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
.pad{padding:18px 20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.grid-brief{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px}

/* source chips */
.src{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:0 5px;font-size:11px;line-height:17px;color:var(--ink2);vertical-align:1px;margin-left:3px;white-space:nowrap}
.src:hover{border-color:var(--ibm);color:var(--ibm);background:#EDF4FF}
.src::before{content:"§";font-size:10px}
.inf{border:1.5px dashed var(--ink3)!important}
.tag{display:inline-block;font-size:11px;line-height:18px;padding:0 7px;border-radius:999px;background:var(--paper);color:var(--ink2);border:1px solid var(--rule2);white-space:nowrap}
.tag.inf{border-style:dashed}
.tag.ibm{background:#EDF4FF;color:var(--ibm);border-color:#C6DAFF}
.tag.client{background:#FBF1E3;color:var(--client);border-color:#F0D6B0}
.tag.both{background:var(--paper)}
.tag.red{background:var(--alert-bg);color:var(--alert);border-color:#FFC9CC}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:#BFE3C7}
.tag.amber{background:var(--signal-soft);color:var(--signal-ink);border-color:#F3DC7A}

/* ---------- brief ---------- */
.sign{background:var(--ink);color:#fff;border-radius:8px;padding:28px 32px 24px;position:relative;overflow:hidden}
.sign .who{font-size:13px;color:#AEBAC4;display:flex;gap:14px;flex-wrap:wrap}
.sign h1{font-family:var(--cn);font-weight:700;font-size:44px;line-height:1.02;letter-spacing:-.02em;margin:10px 0 12px;max-width:30ch;text-wrap:balance}
.sign p{color:#D5DDE3;max-width:72ch;margin:0 0 18px;font-size:16px}
.bullets{display:flex;flex-wrap:wrap;gap:14px 22px;padding-top:16px;border-top:1px solid #33475A}
.bullet{display:flex;align-items:center;gap:8px;font-size:13px;color:#D5DDE3;background:none;border:0;padding:0}
.bullet i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--cn);font-weight:700;font-size:12px;color:#fff}
.bullet:hover span{text-decoration:underline}
.deal{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--rule);border-radius:6px;background:var(--sheet);margin-top:18px}
.deal>div{padding:12px 16px;border-left:1px solid var(--rule2)}
.deal>div:first-child{border-left:0}
.deal .l{font-size:12px;color:var(--ink2)}
.deal .v{font-family:var(--cn);font-size:22px;font-weight:700;line-height:1.2}
.deal .n{font-size:12px;color:var(--ink3)}
.meas{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(160px,1.4fr) 110px;align-items:center;gap:6px 16px}
.meas .ml{font-size:14px;line-height:1.3}
.meas .mv{font-family:var(--cn);font-size:15px;text-align:right;white-space:nowrap}
.meas .mv b{font-weight:700}
.meas .mrow{display:contents}
.bar{position:relative;height:30px}
.bar i{position:absolute;display:block}
.bar .trk{left:0;right:0;top:12px;height:6px;border-radius:3px;background:var(--rule2)}
.bar .grow{top:13.5px;height:3px;background:var(--ok)}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar .grow.anim{animation:growx .9s ease both}
.bar .grow.r{transform-origin:left center}.bar .grow.l{transform-origin:right center}
.bar .db{top:9px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.bar .dt{top:8px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--ok)}
.bar .dt::before{content:"";position:absolute;top:2px;border-top:5px solid transparent;border-bottom:5px solid transparent}
.bar .dt.r::before{left:-6px;border-left:7px solid var(--ok)}
.bar .dt.l::before{right:-6px;border-right:7px solid var(--ok)}
.meas .hd{font-size:12px;color:var(--ink3)}
.note{font-size:13px;color:var(--ink2);border-left:3px solid var(--signal);padding:6px 12px;background:var(--signal-soft);border-radius:0 4px 4px 0;margin-top:14px}
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;align-items:stretch}
.chain .lk{position:relative;padding:12px 18px 12px 14px;border-top:3px solid var(--ink)}
.chain .lk:not(:last-child)::after{content:"";position:absolute;right:-7px;top:-9px;width:0;height:0;border-left:9px solid var(--ink);border-top:7.5px solid transparent;border-bottom:7.5px solid transparent;z-index:2}
.chain .lk b{display:block;font-family:var(--cn);font-size:16px;margin-bottom:2px}
.chain .lk p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.4}
.chain .lk:last-child{border-top-color:var(--ok)}
.now{border-left:4px solid var(--signal)}
.now h3{font-family:var(--cn);font-size:20px;margin:0}
.now .phase{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.now dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:14px}
.now dt{color:var(--ink2);font-size:13px}
.now dd{margin:0}
.now dd button{border:0;background:none;padding:0;text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.now dd button:hover{text-decoration-color:var(--ink)}
.prog{height:8px;border-radius:999px;background:var(--rule2);overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--ink)}
.prog.cash i{background:var(--ok)}
.finds{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.find{border:1px solid var(--rule);border-radius:6px;background:var(--sheet);padding:16px 18px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--alert)}
.find.medium{border-top-color:var(--signal)}
.find h3{font-size:16px;line-height:1.3}
.find p{margin:0;font-size:13.5px;color:var(--ink2)}
.find .ask{font-size:13.5px;color:var(--ink);padding-top:8px;border-top:1px solid var(--rule2);margin-top:auto}
.find .ask b{font-weight:700}
.wo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.wo .col h3{display:flex;align-items:center;gap:8px;font-family:var(--cn);font-size:18px;margin-bottom:8px}
.wo .item{padding:12px 0;border-top:1px solid var(--rule2)}
.wo .item b{display:block;font-size:14.5px}
.wo .item p{margin:2px 0 6px;font-size:13.5px;color:var(--ink2)}
.linkish{border:0;background:none;padding:0;color:var(--ibm);font-size:13px}
.linkish:hover{text-decoration:underline}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.rule{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.rule svg{width:44px;height:44px}
.rule b{font-size:15px}
.rule p{margin:2px 0 0;font-size:13.5px;color:var(--ink2)}
.mini{cursor:pointer;display:block;width:100%;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);padding:10px}
.mini:hover{border-color:var(--ink3)}

/* ---------- route ---------- */
.mapwrap{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow-x:auto;position:relative}
.mapwrap svg{display:block;min-width:1100px;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.maptools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.maptools .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-left:auto;align-items:center}
.maptools .legend span{display:inline-flex;align-items:center;gap:6px}
.st{cursor:pointer}
.st text{pointer-events:none}
.st:hover .ring{stroke:var(--ink);stroke-width:2;opacity:1}
.dim{opacity:.16}
.marker-h{cursor:ew-resize}
.lbl{font-family:var(--cn);font-size:12.5px;fill:var(--ink)}
.lbl.sm{font-size:11px;fill:var(--ink3)}
.under{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;margin-top:22px}
.detail h2{display:flex;align-items:center;gap:10px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:14px;margin:12px 0}
.kv dt{color:var(--ink2);font-size:13px}
.kv dd{margin:0}
.pillist{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:2px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.pill i{width:9px;height:9px;border-radius:50%;display:inline-block}
.pill:hover{border-color:var(--ink3)}
.slip h2{display:flex;align-items:center;gap:10px}
.slipctl{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;margin:12px 0}
.slipctl select{border:1px solid var(--rule);border-radius:6px;padding:7px 10px;background:var(--sheet);width:100%}
.slipctl input[type=range]{width:100%;accent-color:var(--alert)}
.slipctl output{font-family:var(--cn);font-size:16px;color:var(--alert);min-width:90px;text-align:right}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.impacts{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--rule2)}
.impacts li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--rule2);font-size:14px}
.impacts li svg{width:18px;height:18px;margin-top:2px}
.impacts li .w{font-family:var(--cn);white-space:nowrap;color:var(--ink2)}
.impacts li.bad{color:var(--alert)}
.impacts li.bad .w{color:var(--alert)}
.impacts li.good{color:var(--ok)}
.terms{margin:14px 0 0;padding:0;list-style:none}
.terms li{font-size:13.5px;padding:6px 0 6px 14px;border-left:3px solid var(--ink);margin-bottom:6px;background:var(--paper);border-radius:0 4px 4px 0;padding-right:10px}
.recov{margin:10px 0 0;padding:10px 14px;list-style:none;border:1.5px dashed var(--ink3);border-radius:6px}
.recov li{font-size:13.5px;padding:3px 0 3px 18px;position:relative}
.recov li::before{content:"";position:absolute;left:2px;top:11px;width:8px;height:2px;background:var(--ink2)}
.empty{color:var(--ink2);font-size:14px;padding:18px;border:1.5px dashed var(--rule);border-radius:6px;text-align:center}

/* ---------- org ---------- */
.orgtop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.funnel{display:flex;flex-direction:column;align-items:center;gap:6px}
.funnel .lvl{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:9px 14px;text-align:left;display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:center;transition:background .15s}
.funnel .lvl.click{cursor:pointer}
.funnel .lvl.click:hover{border-color:var(--ink3)}
.funnel .lvl .lv{font-size:12px;color:var(--ink3)}
.funnel .lvl b{font-size:14.5px;display:block;line-height:1.25}
.funnel .lvl span.f{font-size:12.5px;color:var(--ink2);display:block;line-height:1.35}
.funnel .lvl.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.funnel .lvl.on .lv,.funnel .lvl.on span.f{color:#C9D3DA}
.funnel .lvl.on .src{background:#2B3B4B;border-color:#4A5865;color:#C9D3DA}
.funnel .lvl.target{border:2px solid var(--signal);background:var(--signal-soft)}
.funnel .ar{width:2px;height:8px;background:var(--rule);position:relative}
.orgtree{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow-x:auto;margin-top:22px}
.orgtree svg{display:block;height:auto;margin:0 auto}
.onode{cursor:pointer}
.onode:hover rect.box{stroke:var(--ink)}
.rel-legend{display:flex;flex-wrap:wrap;gap:8px}
.rel-legend button{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:3px 10px 3px 6px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.rel-legend button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.rel-legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
.ext{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.ext>div{border:1px solid var(--rule);border-radius:6px;background:var(--sheet);padding:10px 12px;width:280px;font-size:13px}
.ext>div b{display:block;font-size:14px}
.ext>div.out{background:repeating-linear-gradient(-45deg,#F4F6F7 0 6px,#fff 6px 12px)}
.ext>div.boundary{border-style:dashed;border-color:var(--ink3)}

/* ---------- process ---------- */
.lanes{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:16px 16px 18px;overflow-x:auto}
.lane{display:grid;gap:12px;min-width:900px;position:relative;z-index:1}
.lane-h{display:flex;align-items:center;gap:10px;margin:0 0 10px;min-width:900px;font-family:var(--cn);font-size:17px;font-weight:700}
.lane-h .tag{font-family:var(--sans);font-weight:400}
.step{border:1px solid var(--rule);border-radius:6px;padding:10px 11px;background:var(--sheet);cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:150px;transition:opacity .15s,border-color .15s}
.step:hover,.step.hl{border-color:var(--ink)}
.step .n{font-family:var(--cn);font-size:12px;color:var(--ink3)}
.step b{font-size:14px;line-height:1.25}
.step .a{font-size:12px;color:var(--ink2)}
.step .stats{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:auto}
.step .stats div{line-height:1.1}
.step .stats strong{font-family:var(--cn);font-size:19px;display:block}
.step .stats span{font-size:11px;color:var(--ink2)}
.step .pain{font-size:11.5px;color:var(--alert);display:flex;gap:4px;align-items:center}
.step.cur{border-top:3px solid var(--ink3)}
.step.fut{border-top:3px solid var(--ok)}
.step.fut .stats strong{color:var(--ok)}
.step.dimmed{opacity:.28}
.gap{height:78px;min-width:900px}
.lanes svg.over{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.stepdetail{margin-top:12px;min-height:56px}
.flowctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sankey{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:10px;overflow-x:auto}
.sankey svg{display:block;width:100%;min-width:760px;height:auto}
.sk-link{fill:none;transition:d .7s ease,stroke-width .7s ease,opacity .3s}
.sk-node{transition:y .7s ease,height .7s ease}
.sk-lbl{transition:y .7s ease,opacity .4s}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:14px}
.kpi{border-top:3px solid var(--ink);padding-top:8px}
.kpi b{font-family:var(--cn);font-size:26px;display:block;line-height:1.1}
.kpi span{font-size:13px;color:var(--ink2)}
.kpi em{font-style:normal;font-size:13px;margin-left:6px}

/* ---------- people ---------- */
.bridge{display:grid;grid-template-columns:minmax(0,1fr) 190px minmax(0,1fr);gap:8px 0;align-items:center}
.bridge .hd{font-family:var(--cn);font-size:17px;font-weight:700;padding-bottom:6px;display:flex;align-items:center;gap:8px}
.bridge .hd.r{justify-content:flex-end}
.pcard{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:8px 12px;font-size:13px;line-height:1.35;position:relative}
.pcard b{font-size:14px;display:block}
.pcard.ibm{border-left:4px solid var(--ibm)}
.pcard.client{border-right:4px solid var(--client);text-align:right}
.pcard.tbd{border-style:dashed;color:var(--ink2)}
.pcard .nt{font-size:11.5px;color:var(--ink3)}
.pstack{display:flex;flex-direction:column;gap:6px}
.pstack.empty{border:1.5px dashed var(--rule);border-radius:6px;padding:12px;color:var(--ink3);font-size:13px;text-align:center}
.area{position:relative;text-align:center;font-size:12.5px;font-weight:700;padding:0 6px;line-height:1.25}
.area::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid var(--ink);z-index:0}
.area.inf::before{border-top-style:dashed;border-top-color:var(--ink3)}
.area.inf{border:0!important}
.area span{position:relative;z-index:1;background:var(--paper);padding:3px 8px;border-radius:999px;display:inline-block;border:1px solid var(--rule)}
.forum{display:grid;grid-template-columns:260px 1fr;gap:16px;padding:12px 0;border-top:1px solid var(--rule2);align-items:center}
.forum b{font-size:14.5px}
.forum .c{font-size:12.5px;color:var(--ink2)}
.forum svg{width:100%;height:36px;overflow:visible}
.dm{width:100%;border-collapse:collapse;font-size:14px}
.dm td{padding:8px 10px;border-top:1px solid var(--rule2);vertical-align:top}
.dm td:first-child{padding-left:0}
.dm td:last-child{font-weight:700}
.steps{display:flex;flex-direction:column}
.stp{border:1px solid var(--rule);border-radius:6px;padding:9px 14px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.stp b{font-family:var(--cn);font-size:16px}
.stp span{font-size:12.5px;opacity:.8;text-align:right}
.clk{display:flex;align-items:center;gap:6px;color:var(--alert);font-size:12.5px;font-weight:700;padding:5px 0 5px 14px}

/* ---------- scope ---------- */
.fence{display:grid;grid-template-columns:minmax(0,1.25fr) 28px minmax(0,1fr) 28px minmax(0,1fr);background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
.fence .zone{padding:16px 18px}
.fence .zone h2{font-size:19px}
.fence .post{background:repeating-linear-gradient(180deg,var(--ink3) 0 14px,transparent 14px 22px) center/3px 100% no-repeat,repeating-linear-gradient(180deg,transparent 0 30px,var(--ink3) 30px 34px) center/16px 100% no-repeat}
.fence .zone.out{background:repeating-linear-gradient(-45deg,#F6F8F8 0 7px,#FFF 7px 14px);border-radius:0 6px 6px 0}
.wsgroup{margin-top:12px}
.wsgroup .wh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:4px}
.wsgroup .wh i{width:16px;height:16px;border-radius:50%;flex:none}
.wsgroup ul,.zone ul{margin:0;padding:0;list-style:none}
.wsgroup li{font-size:13.5px;padding:3px 0 3px 24px;position:relative}
.wsgroup li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;border-radius:50%;background:var(--ink3)}
.bnd{border:1.5px dashed var(--ink3);border-radius:6px;padding:10px 12px;margin-top:12px;background:var(--sheet)}
.bnd b{font-size:14px;display:block;line-height:1.3}
.bnd .r{display:grid;grid-template-columns:62px 1fr;gap:4px 8px;font-size:13px;margin-top:6px}
.bnd .r span:nth-child(odd){color:var(--ink3);font-size:12px}
.outi{padding:9px 0;border-top:1px solid var(--rule2);font-size:13.5px}
.outi:first-of-type{border-top:0}
.outi .o{font-size:12px;color:var(--ink2);display:block}
.slab{position:relative;margin:8px auto 0;max-width:980px}
.slab .top{background:var(--ink);color:#fff;border-radius:6px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:16px;transition:transform .5s ease,background .3s;transform-origin:50% 100%}
.slab .top b{font-family:var(--cn);font-size:22px}
.slab .top span{font-size:13px;color:#C9D3DA}
.slab.broken .top{background:#5A1A1E}
.pillars{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px;margin-top:6px}
.pillar{border:1px solid var(--rule);border-top:6px solid var(--ink);background:linear-gradient(90deg,#F4F6F7,#fff 40%,#F4F6F7);border-radius:0 0 4px 4px;min-height:132px;padding:10px 8px;font-size:12.5px;line-height:1.3;text-align:left;display:flex;flex-direction:column;gap:6px}
.pillar .id{font-family:var(--cn);font-weight:700;font-size:15px}
.pillar:hover{border-color:var(--ink3)}
.pillar[aria-pressed=true]{border-top-color:var(--alert);background:var(--alert-bg);color:#6A0F14;position:relative}
.pillar[aria-pressed=true] .crack{display:block}
.pillar .crack{display:none;margin-top:auto}
.broke{margin-top:14px}
.broke .bi{border-left:3px solid var(--alert);padding:8px 12px;background:var(--alert-bg);border-radius:0 4px 4px 0;margin-bottom:8px;font-size:14px}

/* ---------- risks ---------- */
.riskgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.heat{display:grid;grid-template-columns:28px repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(78px,auto)) 28px;gap:4px}
.heat .cell{border-radius:4px;padding:6px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.heat .ax{font-size:12px;color:var(--ink3);display:grid;place-items:center}
.heat .axl{writing-mode:vertical-rl;transform:rotate(180deg)}
.tok{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;border:2px solid var(--ink);font-family:var(--cn);font-size:13px;font-weight:700;display:grid;place-items:center;padding:0}
.tok.inf{background:#fff;color:var(--ink);border:2px dashed var(--ink)!important}
.tok.sel{box-shadow:0 0 0 3px var(--signal)}
.tok.dim{opacity:.18}
.rlist{list-style:none;margin:0;padding:0}
.rlist li button{display:grid;grid-template-columns:40px 1fr auto;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--rule2);background:none;padding:9px 4px;align-items:center}
.rlist li button:hover{background:var(--paper)}
.rlist li button[aria-current=true]{background:var(--signal-soft)}
.rlist .sc{font-family:var(--cn);font-size:18px;font-weight:700;text-align:center}
.rdetail .row{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--rule2);font-size:14px}
.rdetail .row svg{width:22px;height:22px}
.rdetail .row b{display:block;font-size:12.5px;color:var(--ink2);font-weight:400}

/* ---------- money ---------- */
.stair svg{width:100%;height:auto;display:block}
.split{display:flex;height:46px;border-radius:6px;overflow:hidden;border:1px solid var(--rule);margin-top:6px}
.split div{display:flex;flex-direction:column;justify-content:center;padding:0 8px;font-size:12px;line-height:1.2;border-left:2px solid #fff;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.split div:first-child{border-left:0}
.split div b{font-family:var(--cn);font-size:14px}
.mcols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.mcol{border-top:3px solid var(--ink);padding-top:10px}
.mcol h3{font-family:var(--cn);font-size:17px}
.mcol p,.mcol li{font-size:13.5px;color:var(--ink2);margin:4px 0}
.mcol ul{padding-left:16px;margin:4px 0}
.mcol .big{font-family:var(--cn);font-size:24px;font-weight:700;color:var(--ink);display:block}
.gauge{height:10px;border-radius:999px;background:var(--rule2);overflow:hidden;margin:6px 0}
.gauge i{display:block;height:100%;background:var(--ink3)}

/* ---------- owes ---------- */
.otl svg{width:100%;height:auto;display:block;min-width:900px}
.otl{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow-x:auto}
.buckets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.bucket h3{font-family:var(--cn);font-size:18px;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bucket h3 .cnt{font-family:var(--sans);font-size:12px;color:var(--ink2);font-weight:400}
.ob{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--rule2);align-items:start;font-size:14px}
.ob input{margin-top:3px;width:16px;height:16px;accent-color:var(--ink)}
.ob .meta{font-size:12px;color:var(--ink3);display:flex;gap:8px;margin-top:2px;flex-wrap:wrap;align-items:center}
.ob.done .t{text-decoration:line-through;color:var(--ink3)}
.ob.late .t{color:var(--alert)}
.ob .w{font-family:var(--cn);color:var(--ink2);white-space:nowrap}

/* ---------- faq ---------- */
.faqs{max-width:900px}
.faqs input[type=search]{width:100%;border:1px solid var(--rule);border-radius:6px;padding:10px 14px;background:var(--sheet);font-size:15px}
.qa{border-top:1px solid var(--rule)}
.qa button.q{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:0;background:none;padding:14px 2px;font-size:16px;font-weight:700}
.qa button.q svg{flex:none;transition:transform .2s}
.qa.open button.q svg{transform:rotate(90deg)}
.qa .a{display:none;padding:0 2px 16px;color:var(--ink2);max-width:72ch}
.qa.open .a{display:block}

/* ---------- drawer / palette / tour ---------- */
#scrim{position:fixed;inset:0;background:rgba(23,34,45,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,94vw);background:var(--sheet);z-index:50;transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;border-left:1px solid var(--rule)}
#drawer.on{transform:none}
#drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--rule)}
#drawer .dh h2{margin:0}
#drawer .db{padding:18px 20px;overflow:auto;flex:1}
#drawer blockquote{margin:0 0 18px;padding:14px 16px;border-left:4px solid var(--ibm);background:#F2F6FD;font-size:15px;line-height:1.55}
#drawer .ctx{font-size:14px;line-height:1.6;color:var(--ink2);white-space:pre-wrap}
#drawer mark{background:var(--signal-soft);color:var(--ink);box-shadow:0 0 0 2px var(--signal-soft);border-radius:2px}
#drawer .others{margin-top:16px;display:flex;flex-wrap:wrap;gap:6px}
.x{border:0;background:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.x:hover{background:var(--paper)}
#palette{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(680px,94vw);background:var(--sheet);border:1px solid var(--rule);border-radius:10px;z-index:60;box-shadow:0 18px 50px rgba(23,34,45,.25);display:none;flex-direction:column;max-height:70vh}
#palette.on{display:flex}
#palette input{border:0;border-bottom:1px solid var(--rule);padding:16px 18px;font-size:17px;outline:none;border-radius:10px 10px 0 0}
#palette ul{list-style:none;margin:0;padding:6px;overflow:auto}
#palette li button{display:grid;grid-template-columns:120px 1fr;gap:12px;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:6px;font-size:14px}
#palette li button .ty{font-size:12px;color:var(--ink3)}
#palette li button .sb{display:block;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#palette li button[aria-selected=true]{background:var(--paper)}
#palette .ph{padding:16px 18px;color:var(--ink2);font-size:14px}
#tour{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(560px,94vw);background:var(--ink);color:#fff;border-radius:10px;padding:16px 18px 14px;z-index:45;display:none;box-shadow:0 14px 40px rgba(23,34,45,.35)}
#tour.on{display:block}
#tour .tn{font-size:12px;color:#AEBAC4}
#tour h3{font-family:var(--cn);font-size:21px;margin:2px 0 4px}
#tour p{margin:0 0 12px;color:#D5DDE3;font-size:14.5px}
#tour .tb{display:flex;gap:8px;align-items:center}
#tour .tb .dots{display:flex;gap:5px;margin-right:auto}
#tour .tb .dots i{width:7px;height:7px;border-radius:50%;background:#4A5865}
#tour .tb .dots i.on{background:var(--signal)}
#tour .btn{background:transparent;color:#fff;border-color:#4A5865}
#tour .btn.go{background:var(--signal);color:var(--ink);border-color:var(--signal)}
#err{position:fixed;left:12px;bottom:12px;background:var(--alert);color:#fff;font-size:12px;padding:6px 10px;border-radius:6px;z-index:99;display:none;max-width:60vw}
.flash{animation:flash 1.4s ease 1}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 transparent}30%{box-shadow:0 0 0 4px var(--signal)}}
@keyframes pulse{0%{r:7;opacity:.9}100%{r:16;opacity:0}}
.pulse{animation:pulse 1.8s ease-out infinite}

/* ---------- responsive / motion ---------- */
@media (max-width:1180px){
  .grid-brief,.under,.orgtop,.riskgrid{grid-template-columns:1fr}
  .deal{grid-template-columns:repeat(3,1fr)}
  .deal>div:nth-child(4){border-left:0}
  .deal>div:nth-child(n+4){border-top:1px solid var(--rule2)}
  .finds,.rules{grid-template-columns:1fr}
  .mcols{grid-template-columns:repeat(2,1fr)}
  .weekctl input[type=range]{width:110px}
  .pillars{grid-template-columns:repeat(3,minmax(0,1fr))}
  .fence{grid-template-columns:1fr}
  .fence .post{height:22px;background:repeating-linear-gradient(90deg,var(--ink3) 0 14px,transparent 14px 22px) center/100% 3px no-repeat}
}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto auto 1fr}
  header.top{flex-wrap:wrap;height:auto;padding:10px 14px;position:static}
  .weekctl{margin-left:0;order:3;width:100%}
  .weekctl input[type=range]{flex:1}
  nav.rail{grid-row:3;position:sticky;top:0;height:auto;display:flex;overflow-x:auto;padding:6px;z-index:20;border-right:0;border-bottom:1px solid var(--rule)}
  nav.rail button{grid-template-columns:20px auto;width:auto;white-space:nowrap}
  nav.rail button .k,.rail .foot{display:none}
  main{grid-row:4;padding:18px 14px 80px}
  .sign h1{font-size:32px}
  .chain,.wo,.grid2,.buckets,.kpis{grid-template-columns:1fr}
  .chain .lk:not(:last-child)::after{display:none}
  .deal{grid-template-columns:repeat(2,1fr)}
  .meas{display:block}
  .meas .mrow{display:grid;grid-template-columns:1fr auto;gap:0 12px;margin-bottom:6px}
  .meas .mhead{display:none}
  .meas .bar{grid-row:2;grid-column:1/-1}
  .bridge{grid-template-columns:1fr 110px 1fr}
  .forum{grid-template-columns:1fr}
  .mcols{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media print{
  nav.rail,header.top,.fict,#tour,#palette,#drawer,#scrim{display:none!important}
  #app{display:block}
}
</style>
</head>

<script>
const D = {"meta": {"project": "Project Clearpath", "sow_number": "SOW No. LVH-2026-014", "title": "Prior Authorization Modernization", "client": "Larkspur Valley Health, Inc.", "client_short": "LVH", "unit_short": "the Plan", "vendor": "IBM", "industry": "Integrated health system and health plan", "sow_date": "2026-11-23", "start_date": "2027-01-11", "end_date": "2027-08-20", "term_end": "2027-08-31", "weeks": 32, "headline": "Cut prior authorization decisions from 9.4 days to 5, and get the Plan inside federal timeframes, in 32 weeks.", "summary": "IBM redesigns how Larkspur Health Plan handles prior authorization, from the moment a request arrives to the moment the provider hears back. AI reads incoming faxes and portal documents, low-risk requests in three service categories are approved by rules, and nurses get an AI clinical summary. No request is ever denied by a machine.", "fictional": true, "as_of_week": 9}, "deal": [{"label": "Starts", "value": "Jan 11, 2027", "note": "moves if start conditions slip", "src": ["s3_6start", "s6_1"]}, {"label": "Pilot live", "value": "Week 24", "note": "advanced imaging", "src": ["s4_d15"]}, {"label": "Full go-live", "value": "Week 29", "note": "all three categories", "src": ["s4_d19"]}, {"label": "Finishes", "value": "Aug 20, 2027", "note": "term ends Aug 31", "src": ["s7_run", "s13"]}, {"label": "Fixed fee", "value": "$4.86M", "note": "plus expenses, 7% cap unless approved", "src": ["s11_1", "s11_2"]}, {"label": "IBM team", "value": "~14 at peak", "note": "onshore and offshore", "src": ["s8_1team"]}], "why": [{"label": "Strategy", "text": "The Plan's 2026 to 2028 strategy, Simpler Care, Sooner, puts less provider burden and faster access to care first.", "src": ["s1_2strat"]}, {"label": "Problem", "text": "410,000 requests a year, half of them on fax or phone, a 9.4 day median wait, and only 81% of urgent requests decided in 72 hours.", "src": ["s1_4vol", "s1_4time"]}, {"label": "Pressure", "text": "Federal rules (CMS-0057-F) require 72 hour and 7 day decisions and public reporting. The Board wants measurable improvement by Q3 2027.", "src": ["s1_5cms", "s1_5board"]}, {"label": "Answer", "text": "Redesign the process end to end and add AI intake, rule-based approval of low-risk requests and AI clinical summaries.", "src": ["s2_1"]}], "measures": [{"id": "M1", "label": "Median decision time, standard requests", "baseline": 9.4, "target": 5.0, "unit": " days", "better": "down", "min": 0, "max": 10, "format": "days", "src": ["s2_2a"]}, {"id": "M2", "label": "Expedited requests decided within 72 hours", "baseline": 81, "target": 99, "unit": "%", "better": "up", "min": 50, "max": 100, "format": "pct", "src": ["s2_2b"]}, {"id": "M3", "label": "Requests received electronically", "baseline": 50, "target": 75, "unit": "%", "better": "up", "min": 0, "max": 100, "format": "pct", "src": ["s2_2c"]}, {"id": "M4", "label": "Approved by rules without nurse review", "baseline": 4, "target": 25, "unit": "%", "better": "up", "min": 0, "max": 100, "format": "pct", "note": "baseline is under 4%", "src": ["s2_2d"], "baseline_label": "<4%"}, {"id": "M5", "label": "Intake handling time per fax request", "baseline": 22, "target": 6, "unit": " min", "better": "down", "min": 0, "max": 25, "format": "min", "src": ["s2_2e"]}, {"id": "M6", "label": "Requests pended for missing documents", "baseline": 42, "target": 20, "unit": "%", "better": "down", "min": 0, "max": 100, "format": "pct", "src": ["s2_2f"]}, {"id": "M7", "label": "Provider satisfaction with prior auth", "baseline": 2.9, "target": 3.8, "unit": " / 5", "better": "up", "min": 1, "max": 5, "format": "score", "src": ["s2_2g"]}], "measures_note": {"text": "These are shared goals, not IBM guarantees, and missing one is not by itself a breach. They are measured only for the service categories live at the time, over the four weeks before the Benefits Realization Report.", "src": ["s2_2shared", "s2_2window"]}, "principles": [{"title": "No automated denials", "text": "Rules can approve or route to a person. Only a licensed clinician can say no.", "src": ["s2_3a"]}, {"title": "A person checks low-confidence reads", "text": "If the AI is unsure what it extracted, an intake coordinator verifies it. The Design Authority sets the threshold.", "src": ["s2_3b"]}, {"title": "Every decision is traceable", "text": "Each automated approval and AI summary records the criteria, documents and model version behind it.", "src": ["s2_3c"]}], "watchouts": [{"lens": "ibm", "title": "The targets are shared, not promised", "text": "The SOW says missing a Success Measure is not by itself a breach. Keep that framing in every status report so the measures do not quietly become guarantees.", "src": ["s2_2shared"], "go": "brief:measures"}, {"lens": "ibm", "title": "Four assumptions carry the price", "text": "Pilot volume under 4,500 a week, no UM Platform vendor development, 85% structured codes, and criteria licenses that allow automation. Check each one early and raise a PCR the day one fails.", "src": ["s9a", "s9b", "s9c", "s9h"], "go": "scope:assumptions"}, {"lens": "ibm", "title": "Gates protect the cash", "text": "If a forum does not meet within 5 business days of IBM's request, a governance milestone completes when IBM meets the entry criteria in D1. Write those criteria carefully in Week 2.", "src": ["s12gov"], "go": "money"}, {"lens": "ibm", "title": "Only about a week of room at the end", "text": "Final Acceptance is planned for Aug 20 and the term ends Aug 31. Any slip after Full Go-Live needs a PCR or the hypercare option to stay inside the term.", "src": ["s7_run", "s13"], "go": "route:D21"}, {"lens": "client", "title": "Data access is due in Week 3", "text": "Read-only access to 24 months of UM Platform event logs within 10 business days of the start. The baseline, and everything after it, waits on this.", "src": ["s6_2a"], "go": "route:CD1"}, {"lens": "client", "title": "Dr. Raman is on the critical path", "text": "The Clinical Policy Owner signs every Auto-Approval Rule in writing and owes clinical decisions within 5 business days, at 20% of her time through Phases 2 and 3.", "src": ["s6_3a", "s4_d5"], "go": "route:CD4"}, {"lens": "client", "title": "Software is bought separately", "text": "watsonx subscriptions, UM Platform vendor work, the FHIR API and end-user training are not in the fee. The watsonx subscription needs to be active by Week 10.", "src": ["s5g", "s5a", "s5h", "s9e"], "go": "scope"}, {"lens": "client", "title": "Silence counts as acceptance", "text": "Each deliverable has a 5 business day review window. No written objection in that window, or using it in production, means it is accepted.", "src": ["s6_4", "s12deemed"], "go": "owes"}], "findings": [{"id": "F1", "severity": "high", "title": "Security review can outlast Design Approval", "text": "Information Security has 15 business days to review the architecture (D6, Week 12), which runs to Week 15. But Design Approval (D8) in Week 13 needs D6 approved by Information Security. If the client uses the full window, the build starts two weeks late and Final Acceptance slips past the end of the term. It also sits oddly next to the 5 business day review every other deliverable gets.", "ask": "Agree in Week 2 that LVH Information Security will finish its review by Week 13, or move D8.", "src": ["s6_2c", "s4_d6", "s4_d8", "s6_4"], "go": "route:CD3"}, {"id": "F2", "severity": "medium", "title": "Two forums claim Design Approval", "text": "Section 4 says Design Approval (D8) is a Design Authority decision. Section 8.3(a) says the Executive Steering Committee approves governance milestones. Since D8 releases a $972,000 payment, decide which forum signs it.", "ask": "Name the approving forum for D8 in the Project Charter (D1).", "src": ["s4_d8", "s8_3a"], "go": "people"}, {"id": "F3", "severity": "medium", "title": "Wave 3 barely makes the benefits window", "text": "Success Measures are taken over the four weeks before the Benefits Realization Report (Weeks 27 to 30). Outpatient surgery goes live in Week 29, so it contributes two weeks of data, both in elevated support.", "ask": "Agree how Wave 3 results will be read, or measure it separately during hypercare.", "src": ["s2_2window", "s4_d19", "s7_monday"], "go": "route:D20"}, {"id": "F4", "severity": "medium", "title": "\"By the third quarter\" can be read two ways", "text": "The Board wants measurable improvement \"by the third quarter of 2027\". If that means by July 1, the Benefits Realization Report (Week 31, Aug 13) arrives too late and the pilot results (Week 26, Jul 9) are the first hard numbers. If it means by Sep 30, the plan has about seven weeks to spare.", "ask": "Confirm with the Executive Sponsor which date the Board expects, and what it will see.", "src": ["s1_5board", "s4_d16", "s4_d20"], "go": "route:D16"}], "workstreams": [{"id": "WS1", "name": "Process Discovery and Design", "short": "Process", "color": "#8a3ffc", "summary": "Process Studio and process mining on UM Platform event logs, up to 12 workshops, future-state design for three service categories.", "src": ["s3_1"]}, {"id": "WS2", "name": "Intelligent Intake and Clinical Review", "short": "AI and rules", "color": "#0f62fe", "summary": "watsonx intake, up to 120 Auto-Approval Rules, a prior auth requirement check, and AI clinical summaries for nurses.", "src": ["s3_2"]}, {"id": "WS3", "name": "Integration and Data", "short": "Integration", "color": "#007d79", "summary": "Integrations to the UM Platform REST APIs, an interface spec for the Interop Vendor's FHIR API, and an operations dashboard.", "src": ["s3_3"]}, {"id": "WS4", "name": "Change, Training and Provider Adoption", "short": "Change", "color": "#d02670", "summary": "Change impact, training for up to 40 super users, and a campaign to move providers off fax and phone.", "src": ["s3_4"]}, {"id": "WS5", "name": "Project Management and Governance", "short": "PMO", "color": "#525252", "summary": "Integrated plan, risk,
